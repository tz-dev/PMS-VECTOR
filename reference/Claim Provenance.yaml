claim_provenance:
  meta:
    artifact: PMS-VECTOR Claim Provenance
    role: machine-readable provenance and lineage bookkeeping layer
    paper_source: PMS-VECTOR.md — Appendix F.1–F.8
    model_reference: model/PMS-VECTOR.yaml
    hard_pms_dependency: PMS.yaml
    governing_rule: lineage supports provenance, not authority inheritance
    one_status_per_claim: true
    ordering_implied: false
    epistemic_strength_implied: false
    warrant_inheritance_implied: false
    non_equivalences:
    - ProvenanceCompleteness != TheoreticalAdequacy
    - provenance status != evidence strength
    - source precedence != claim truth
    - shared source != dependency
  categories:
    C:
      label: Corpus-carried
      meaning: Explicitly carried by the existing PMS corpus in materially relevant form.
    R:
      label: VECTOR reconstruction
      meaning: Reconstructed by VECTOR from one or more corpus-carried structures without claiming that the combined relation
        was already canonical.
    N:
      label: VECTOR-new
      meaning: A distinct positive claim introduced by PMS-VECTOR.
    P:
      label: Proposed / provisional formalization
      meaning: A notation, record field, schema, or formal device used for audit or reuse rather than claimed as an independently
        established theoretical result.
  source_registry:
    PMS_BASE:
      label: PMS Base
      lineage_role: governing PMS operator grammar, base semantics, openness and non-capture precedent
      runtime_dependency: true
      dependency_file: PMS.yaml
    MIP:
      label: MIP
      lineage_role: trajectory, power, feedback, dignity boundary precedent
      runtime_dependency: false
    PMS_ANTICIPATION:
      label: PMS-ANTICIPATION
      lineage_role: future orientation, timing, restraint, effective capacity
      runtime_dependency: false
    PMS_CRITIQUE:
      label: PMS-CRITIQUE
      lineage_role: direction, correction, review distance, follow-up
      runtime_dependency: false
    PMS_CONFLICT:
      label: PMS-CONFLICT
      lineage_role: shrinking options, carriage, fixpoint, tragic non-integrability
      runtime_dependency: false
    PMS_EDEN:
      label: PMS-EDEN
      lineage_role: truthful coordination, learned legibility, counter-scenes, reciprocity boundary
      runtime_dependency: false
    PMS_LOGIC:
      label: PMS-LOGIC
      lineage_role: effective capacity and baseline structural attributability
      runtime_dependency: false
    PMS_SEX:
      label: PMS-SEX
      lineage_role: exit realism and downstream cost
      runtime_dependency: false
    PMS_DISCIPLINE:
      label: PMS-DISCIPLINE
      lineage_role: bounded adequacy, correction before coherence, stop / refusal / claim ceilings
      runtime_dependency: false
    PMS_UNDER_LOAD:
      label: PMS UNDER LOAD
      lineage_role: pressure and self-reduction precedent; not warrant
      runtime_dependency: false
    PMS_STRATA:
      label: PMS-STRATA
      lineage_role: local superiority, non-compensation, claim reduction, rival superiority, non-capture
      runtime_dependency: false
    PMS_VECTOR:
      label: PMS-VECTOR
      lineage_role: owner of VECTOR-specific claims, reconstructions, reductions, and provisional formalizations
      runtime_dependency: false
  source_boundaries:
  - source: PMS_BASE
    boundary: open problem in Base != warrant for VECTOR as its solution
  - source: MIP
    boundary: Adult Orientation shorthand != AdultPerson; MIP supplies boundary precedent, not warrant for the shorthand
  - source: PMS_ANTICIPATION
    boundary: later possibility recognition != earlier effective capacity
  - source: PMS_CRITIQUE
    boundary: CRITIQUE supplies pressure and reconstruction; ROT is not inherited as a CRITIQUE operation
  - source: PMS_CONFLICT
    boundary: system-level carriage != person-level duty
  - source: PMS_EDEN
    boundary: perspectival access != perspectival equivalence
  - source: PMS_LOGIC
    boundary: LOGIC responsibility != VECTOR Ought typology
  - source: PMS_SEX
    boundary: No larger VECTOR architecture is attributed to SEX.
  - source: PMS_DISCIPLINE
    boundary: application/use discipline != verdict authority; May this use proceed? != What directional relation, if any,
      is warranted?
  - source: PMS_UNDER_LOAD
    boundary: UNDER LOAD supplies VECTOR pressure, not VECTOR warrant
  - source: PMS_STRATA
    boundary: ROT != PROJECT_AS; OptionSpaceTransformation != fourth STRATA operation; borrowed discipline != inherited warrant
