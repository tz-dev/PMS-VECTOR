  failure_routes:
  - route_id: robust_orientation.missing_relevant_rot
    root: RobustOrientation
    trigger: materially relevant ROT is missing
    response: reduce_to
    target: BoundedOrientation
    paper_ref: Appendix F.9
  - route_id: robust_orientation.reference_continuity_failure
    root: RobustOrientation
    trigger: reference continuity fails
    response: reduce_or_retype
    targets:
    - NonCapture
    - Revision
    paper_ref: Appendix F.9
  - route_id: robust_orientation.rival_defeats_baseline
    root: RobustOrientation
    trigger: serious rival defeats the baseline
    response: revise_or_collapse
    targets:
    - Revision
    - Collapse
    paper_ref: Appendix F.9
  - route_id: ought_account.missing_uptake
    root: OUGHT_account
    trigger: relevant actor uptake is missing
    response: remove_orientation_mediated_uplift
    target: BaselineAttributability_LOGIC
    boundary: baseline LOGIC attributability may remain independently supported
    paper_ref: Appendix F.9
  - route_id: ought_account.missing_effective_capacity
    root: OUGHT_account
    trigger: effective capacity falls away
    response: reduce_or_retype
    target: OUGHT_account
    paper_ref: Appendix F.9
  - route_id: ought_account.defeated_external_relation
    root: OUGHT_account
    trigger: external premise or consequence relation is defeated by a rival explanation
    response: weaken
    target: OUGHT_account
    paper_ref: Appendix F.9
  - route_id: ought_constraint.real_invisible_option_discovered
    root: OUGHT_constraint
    trigger: a previously invisible effective option becomes evidenced within the relevant frame and time
    response: revise_response_class
    target: EffectiveOptionField
    boundary: field revision does not by itself retroactively diagnose Option Blindness
    paper_ref: Appendix F.9 / Chapter 19.6
  - route_id: ought_constraint.g_revised
    root: OUGHT_constraint
    trigger: G is revised
    response: new_constraint_claim_required
    target: OUGHT_constraint
    paper_ref: Appendix F.9
  - route_id: ought_constraint.unsupported_bearer_assignment
    root: OUGHT_constraint
    trigger: system-level carriage is real but bearer assignment is unsupported
    response: collapse_person_assignment_preserve_system_relation
    targets:
    - SystemCarriageRequired
    - PersonXMustCarry
    paper_ref: Appendix F.9
  - route_id: tragic_constraint.real_no_loss_option
    root: TragicConstraint
    trigger: a previously invisible effective no-loss option is evidenced
    response: collapse
    target: TragicConstraint
    boundary: current tragic classification collapses; prior invisibility alone does not establish prior Option Blindness
    paper_ref: Appendix F.9 / Chapter 19.6
  - route_id: tragic_constraint.second_order_opens_no_loss
    root: TragicConstraint
    trigger: Second-Order Agency can create or open a non-lossful route in time
    response: collapse
    target: TragicConstraint
    paper_ref: Appendix F.9
  - route_id: tragic_constraint.field_misdescribed
    root: TragicConstraint
    trigger: a rival demonstrates that the option/constraint field was materially misdescribed, including unsupported exclusion or unsupported inclusion where material
    response: collapse_or_retype
    target: TragicConstraint
