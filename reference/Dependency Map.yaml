dependency_map:
  meta:
    artifact: PMS-VECTOR Dependency Map
    role: declared dependency, vulnerability, prohibited-inference, and enacted-reduction topology
    paper_source: PMS-VECTOR.md — Appendix F.9; Chapter 19.6 option-status discrimination burden
    model_reference: model/PMS-VECTOR.yaml
    governing_rule: dependency transmits vulnerability, not automatic warrant
    inferred_edges_allowed: false
    cooccurrence_edges_allowed: false
    shared_provenance_creates_dependency: false
    graph_centrality_has_theoretical_meaning: false
    edge_count_has_evidential_meaning: false
    non_equivalences:
    - dependency != warrant
    - graph depth != theoretical importance
    - node degree != epistemic strength
    - visual adjacency != undeclared dependency
    - option invisibility != option blindness
    - warranted bounded negative != option blindness by default
    - special-case or imagined probe != effective option
  load_bearing_roots:
  - RobustOrientation
  - OUGHT_account
  - OUGHT_constraint
  - TragicConstraint
  - CorrigibleConsequenceCarryingPraxis
  - StandaloneVECTOR
  dependency_nodes:
    RobustOrientation:
      kind: claim
      description: robust orientation result
      load_bearing_root: true
    TypedDIR:
      kind: construct
      description: typed bounded DIR relation
    RelevantROT:
      kind: construct
      description: materially relevant ROT burden
    DeclaredChange:
      kind: condition
      description: ROT declares what changes
    DeclaredConstants:
      kind: condition
      description: ROT declares what is held constant
    ReferenceContinuity:
      kind: condition
      description: ROT preserves relevant reference continuity
    LossCapacity:
      kind: condition
      description: ROT has credible capacity to weaken, revise, collapse, or retype the claim
    SeriousRivalPressure:
      kind: condition
      description: serious rival pressure can materially defeat or reduce the claim
    ProvenanceEchoAudit:
      kind: condition
      description: provenance and echo control are audited
    NonCompensation:
      kind: condition
      description: loss in one relation is not silently compensated by another
    NoUnresolvedClaimCriticalRegression:
      kind: condition
      description: no unresolved claim-critical regression remains hidden
    PreservedResidue:
      kind: condition
      description: remaining residue / Λ is preserved rather than erased
    BoundedOrientation:
      kind: result
      description: bounded orientation without full robustness status
    NonCapture:
      kind: result
      description: positive boundary result where required claim conditions cannot responsibly be preserved
    Revision:
      kind: result
      description: materially revised claim state
    Collapse:
      kind: result
      description: claim collapse
    OUGHT_account:
      kind: claim
      description: orientation-mediated practical accounting relation
      load_bearing_root: true
    RelevantOrientation:
      kind: condition
      description: relevant bounded orientation
    ExternalPremiseSupport:
      kind: condition
      description: material external premises are supported
    ActorUptake:
      kind: condition
      description: orientation is actor-accessible and sufficiently understood for contest or response
    EffectiveCapacity:
      kind: condition
      description: actor or role has relevant effective capacity
    ConsequenceRelation:
      kind: condition
      description: capacity is connected to subsequent praxis through attributable consequence
    RoleTimeConditions:
      kind: condition
      description: role and scene-time conditions keep the relation materially live
    BaselineAttributability_LOGIC:
      kind: external_relation
      description: baseline PMS-LOGIC attributability relation
    OrientationMediatedAttributionUplift:
      kind: derived_relation
      description: VECTOR-specific change in attributability attributable to relevant orientation and uptake
    OUGHT_constraint:
      kind: claim
      description: constraint-relative must-like practical relation
      load_bearing_root: true
    OperativeG:
      kind: condition
      description: G is actually operative
    EffectiveOptionField:
      kind: condition
      description: effective option field is evidence-typed under declared frame, role, time, capacity, dependency, and option-misrepresentation pressure
    NonEmptyResponseClass:
      kind: condition
      description: response class R_G is non-empty
    ResponsesSatisfyG:
      kind: condition
      description: each member of R_G satisfies the relevant G-condition
    ConstraintActorRelationsVisible:
      kind: condition
      description: maintainer, modifier, and claimed authority are visible
    ConstraintBurdenExitAlternativesVisible:
      kind: condition
      description: burden bearers, exit relations, and alternative carriers are visible
    TransformationRoutesConsidered:
      kind: condition
      description: evidenced transformation routes are considered
    LegitimacyQuestionExternalized:
      kind: boundary
      description: legitimacy remains external unless separately warranted
    SystemCarriageRequired:
      kind: relation
      description: system-level carriage requirement
    PersonXMustCarry:
      kind: relation
      description: person-specific bearer assignment
    TragicConstraint:
      kind: claim
      description: evidentially bounded tragic constraint
      load_bearing_root: true
    ValidOUGHTConstraint:
      kind: condition
      description: valid OUGHT_constraint configuration
    ResidualLossAcrossRG:
      kind: condition
      description: residual loss remains across all responses in R_G
    SecondOrderMechanismAudit:
      kind: condition
      description: evidenced second-order transformation mechanisms are audited to distinguish realistic transformability from imagined possibility
    CapacityAuthorityDependencyWindowAudit:
      kind: condition
      description: capacity, authority, dependency, and window conditions are audited
    NoEvidencedNonLossfulRoute:
      kind: condition
      description: no currently evidenced effective non-lossful route exists in the declared field
    EvidencedNonLossfulRoute:
      kind: falsifier
      description: real effective no-loss route evidenced within the bounded field
    ImaginedRescueRoute:
      kind: probe
      description: merely imagined rescue route
    CorrigibleConsequenceCarryingPraxis:
      kind: claim
      description: corrigible consequence-carrying praxis; Adult Orientation is supporting shorthand only
      load_bearing_root: true
    BoundedRelevantOrientation:
      kind: condition
      description: bounded relevant orientation
    PreservedCorrigibility:
      kind: condition
      description: corrigibility remains available
    CarriesRelevantConsequence:
      kind: condition
      description: relevant consequence is carried rather than externalized or erased
    CapacityLimitsAwareness:
      kind: condition
      description: capacity limits remain visible
    OrientationEnactmentSourceConditions:
      kind: condition
      description: orientation–enactment source conditions are handled without reifying derived DIST
    DistributedAgencyRecognition:
      kind: condition
      description: distributed agency is recognized where relevant
    NoOrientationAuthorityConversion:
      kind: boundary
      description: orientation is not converted into authority over others
    AdultOrientation:
      kind: supporting_shorthand
      description: supporting shorthand only; no independent dependency root
      independent_dependency_root: false
    StandaloneVECTOR:
      kind: claim
      description: standalone VECTOR theory claim
      load_bearing_root: true
    DIRAddsDiscrimination:
      kind: condition
      description: DIR adds discrimination not losslessly supplied elsewhere
    ROTAddsBeyondReframing:
      kind: condition
      description: ROT adds more than ordinary reframing
    DISTCoreReductionAccepted:
      kind: condition
      description: prior DIST core claim is genuinely reduced rather than protected
    AdultOrientationReductionAccepted:
      kind: condition
      description: Adult Orientation is reduced to supporting shorthand after deletion testing
    OptionStatusDiscrimination:
      kind: condition
      description: corrigible bidirectional option-status discrimination under evidence-typed conditions
    InvisibilityBlindnessSeparation:
      kind: condition
      description: Option Invisibility remains distinguishable from unsupported exclusion / Option Blindness
    BlindnessBoundedNegativeSeparation:
      kind: condition
      description: Option Blindness remains distinguishable from a warranted bounded negative after appropriate option and transformation pressure
    ProbeIllusionSeparation:
      kind: condition
      description: analytical or special-case probes remain distinguishable from unsupported inclusion / Option Illusion
    BidirectionalFieldCorrection:
      kind: condition
      description: represented option fields can expand or contract when evidence warrants revision
    OptionTaxonomyReducibility:
      kind: vulnerability_condition
      description: option taxonomy remains reducible, narrowable, recalibratable, or removable if its distinctions fail to discriminate or become post hoc stabilization vocabulary
    SecondOrderAgencyMechanismDiscrimination:
      kind: condition
      description: second-order agency adds field-transformation discrimination under mechanism evidence
    CostTopologyDiscrimination:
      kind: condition
      description: cost topology adds non-fungible consequence discrimination without speculative inflation
    ConvergenceClosureClaimLossAndStop:
      kind: condition
      description: convergence / closure machinery produces real claim loss and bounded stop
    SpecialistRivalCanWin:
      kind: condition
      description: specialist rivals can win specialist burdens without assimilation
    SameBurdenRivalCanReduce:
      kind: condition
      description: same-burden non-PMS rivals can reduce DIR / ROT / standalone scope
    OughtTypologyPreventsConflation:
      kind: condition
      description: Ought typology prevents rather than causes normative conflation
    CoreRemainsReducible:
      kind: condition
      description: remaining DIR–ROT core remains reducible if its contributions fail
    Reduction:
      kind: result
      description: theory or component reduction
    DIR:
      kind: construct
      description: Direction core component
    ROT:
      kind: construct
      description: Rotation core component
    DIST:
      kind: construct
      description: derived supporting orientation–enactment separation descriptor
    REV_avail:
      kind: construct
      description: effective reversibility availability
    SourceG:
      kind: relation
      description: source or maintenance origin of G
    LegitimacyG:
      kind: external_relation
      description: legitimacy of G
    FixpointRequirement:
      kind: relation
      description: functional fixpoint requirement
    BearerAuthority:
      kind: external_relation
      description: authority of a bearer
    PresentedOrientation:
      kind: relation
      description: orientation presented to an actor
    DecisionAuthority:
      kind: external_relation
      description: authority to decide for or bind others
  dependency_edges:
  - edge_id: robustorientation.depends.typeddir
    dependent: RobustOrientation
    dependency: TypedDIR
    relation: depends_on
    role: bounded Direction must be typed and warranted
    paper_ref: Appendix F.9
  - edge_id: robustorientation.depends.relevantrot
    dependent: RobustOrientation
    dependency: RelevantROT
    relation: depends_on
    role: materially relevant ROT burden must be discharged
    paper_ref: Appendix F.9
  - edge_id: robustorientation.depends.seriousrivalpressure
    dependent: RobustOrientation
    dependency: SeriousRivalPressure
    relation: depends_on
    role: serious rival pressure must be allowed to change or defeat the claim
    paper_ref: Appendix F.9
  - edge_id: robustorientation.depends.provenanceechoaudit
    dependent: RobustOrientation
    dependency: ProvenanceEchoAudit
    relation: depends_on
    role: provenance and echo control must prevent recurrence from masquerading as independent support
    paper_ref: Appendix F.9
  - edge_id: robustorientation.depends.noncompensation
    dependent: RobustOrientation
    dependency: NonCompensation
    relation: depends_on
    role: loss in one relation cannot be silently offset by another
    paper_ref: Appendix F.9
  - edge_id: robustorientation.depends.nounresolvedclaimcriticalregression
    dependent: RobustOrientation
    dependency: NoUnresolvedClaimCriticalRegression
    relation: depends_on
    role: known claim-critical regression cannot remain unresolved
    paper_ref: Appendix F.9
  - edge_id: robustorientation.depends.preservedresidue
