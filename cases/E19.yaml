  pressure:
    rivals: []
    counter_scenes: []
    provenance_dependencies:
      - >-
        PMS-VECTOR owns Convergence Provenance and Echo Control as part of the
        convergence test architecture; the relevant relation is dependency audit,
        not historical lineage as epistemic rank.
      - >-
        PMS-VECTOR requires separately warranted and distinctly constrained local
        DIRs for meaningful convergence and does not permit a resultant orientation
        to retroactively warrant weak local components.
      - >-
        The shared assumption A remains an unresolved dependency. Its repeated use
        across five analyses does not create additional warrant for A.
    non_compensation: >-
      Numerical or rhetorical multiplicity of outputs cannot compensate for a
      claim-critical shared untested dependency. Five echoes do not become five warrants.
    critical_open_tests:
      - Separately pressure assumption A before restoring any stronger convergence or DIR_R claim.

  result:
    status: Revision Required
    surviving_claim: >-
      Five local analyses exhibit a similar directional conclusion, but their
      multiplicity does not provide five independent warrants because each materially
      depends on the same untested assumption A. The stronger convergence claim is reduced.
    revisions:
      - >-
        Apparent fivefold support for DIR_R -> dependency-typed echo convergence
        pending separate pressure on A.
    scope: >-
      The reduction applies to what d1 through d5 can jointly warrant as a convergence
      claim at the current audit state. It does not by itself invalidate each local
      analysis or establish that no later resultant orientation can be warranted.
    residue:
      - The warrant status of assumption A remains unresolved.
      - >-
        Whether a common DIR_R can survive after A is separately pressured remains open.
    stop_reason: >-
      The dependency audit is sufficient to defeat the claim that five nominally
      separate outputs supply five independent warrants. The fixture may stop at
      Revision Required; stronger convergence requires re-entry after separate pressure on A.
