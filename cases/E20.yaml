case_metadata:
  case_id: E20
  paper_ref: Appendix E.20
  title: Non-Capture
  case_format: full_minimal_case
  adversarial:
    marked: false
    paper_label: null
  load_bearing: true
  pressure_families:
    - type_boundary_pressure
    - non_capture_pressure
    - person_worth_boundary_pressure
  constructs_under_test:
    - NonCapture
    - ReferenceObject
    - PersonWorthBoundary
  theoretical_function: >-
    Tests whether an invalid person-ranking request is refused as Non-Capture
    rather than repaired into an intrinsic person score; a retyped bounded question
    is a new claim.
  artifact_pair:
    yaml: cases/E20.yaml
    markdown: cases/E20.md
  architecture_effect:
    applies: false
    targets: []
    effect: null
  non_implications:
    - >-
      Non-Capture does not mean that the two employees are equal, incomparable as
      persons, or insufficiently documented; it means the requested person-level
      VECTOR ranking is not a valid output type.
    - >-
      Adding more workplace observations cannot by itself repair the category jump
      from bounded enactment analysis to intrinsic person ranking.
    - >-
      Retyping the question to compare bounded incident-response procedures creates
      a new claim; it is not completion or rescue of the original person-ranking
      request.
    - Suspend is not equivalent to Non-Capture.

vector_record:
  reference:
    object: >-
      The requested comparison "Which of two employees has the higher VECTOR?" as
      a person-level ranking derived from observed workplace enactments.
    object_type: invalid person-level VECTOR ranking request

  frame:
    included:
      - Several observed workplace enactments involving the two employees.
      - Different roles across the observed enactments.
      - Different constraints, histories, and authority conditions across those enactments.
      - The evaluator's request for one person-level VECTOR comparison.
    excluded:
      - Intrinsic person quality as a VECTOR reference scale.
      - Human worth or dignity as a quantity to be ranked.
      - Any person-level score obtained by compressing heterogeneous bounded enactments into one intrinsic ranking.
      - Any assumption that additional data can repair an invalid claim type without changing the question.

  question:
    scope: >-
      Can VECTOR validly answer the requested question "Which of two employees has
      the higher VECTOR?" by converting the supplied bounded workplace enactments
      into a person-level ranking?
    claim_ceiling: >-
      The record may determine only whether the requested VECTOR operation is
      admissible in its current form. It cannot rank intrinsic person quality,
      dignity, or worth, and it cannot treat a retyped bounded comparison as the
      completion of the original request.

  position:
    perspective: evaluator reviewing several workplace enactments
    temporal_position: >-
      Across the supplied observations under differing roles, constraints,
      histories, and authority conditions.
    scene_time: null
    analysis_time: null

  baseline_claim: >-
    The observed workplace enactments can be compressed into a single person-level
    VECTOR score that permits the two employees to be ranked against one another.

  dir:
    relation: null
    comparison_basis: >-
      No valid person-level DIR comparison is available because the requested
      reference object converts bounded enactment relations into an intrinsic
      person-ranking claim that VECTOR does not license.
    warrant:
      source_types:
        - PMS-VECTOR person-worth and reference-object boundary
        - Appendix E.20 case type boundary
      external_premises: []
      unresolved_dependencies: []
    critical_regressions:
      - >-
        The observed enactments occur under different roles, constraints, histories,
        and authority conditions; collapsing them into a person-level score changes
        the claim type rather than merely aggregating more evidence.
      - >-
        More data about the same employees would not make an intrinsic person-ranking
        output valid in the original form.
      - >-
        A bounded comparison of procedures or enactments can become legitimate only
        by changing the reference object and question, thereby creating a new claim.

  calibration:
    threshold: null
    basis: null
    domain_source: null
    competing_calibration: null
    unresolved: null

  rot_profile:
    applied: []
    untested_relevant: []
    stop_basis: >-
      The requested operation fails at the reference/type boundary before
      robustness-bearing rotation is required. Non-Capture is already the proper
      terminal result; additional ROT cannot convert an invalid person-ranking claim
      into a valid one without changing the claim itself.

