    actor_response: null

  pressure:
    rivals:
      - >-
        Rival procedure R uses a compact hazard-control record based on exposure
        counts, event severity, and corrective-action closure rather than
        preserving every near-miss narrative. R remains in its own operational
        vocabulary, is simpler and cheaper to administer, and would defeat Y for
        the declared question if its aggregation preserved the same role-specific
        exposure and correction pathways with less reporting friction. In the
        bounded fixture, however, R removes which role repeatedly bears the
        near-miss exposure and thereby prevents recognition of a recurring
        transferred-risk pattern.
    counter_scenes: []
    provenance_dependencies:
      - >-
        PMS-VECTOR owns the DIR / ROT / Robust Orientation architecture used in
        this fixture; the operational facts that carry the comparison remain
        case-supplied rather than generated by VECTOR notation.
    non_compensation: >-
      R's lower administrative burden remains a real advantage, but it does not
      compensate for losing the repeated role-specific exposure relation because
      that relation is claim-critical to the declared corrective-learning question.
    critical_open_tests: []

  result:
    status: Robust Orientation
    surviving_claim: >-
      Within the declared safety-review frame, question, perspectives, review
      cycles, and evidence pattern, Procedure Y remains directionally favored
      over Procedure X: X ≺_{V,C} Y. The claim-relevant core survives the applied
      affected-role ROT, temporal ROT, and serious rival pressure without material
      revision.
    revisions: []
    scope: >-
      The Robust Orientation is restricted to the declared reporting procedures,
      current safety-review process, corrective-learning question, materially
      relevant role and temporal pressures, and the bounded evidence pattern in
      which R loses the recurring role-specific exposure relation.
    residue:
      - R's lower administrative burden remains a real local advantage.
      - A different question focused on administrative load could change the comparison.
      - A different evidence pattern in which R preserved the same role-specific exposure and correction pathways could reverse the result.
    stop_reason: >-
      The baseline DIR survives the materially relevant current ROT pressures and
      a serious rival with a credible route to win, while the rival's actual loss
      is claim-critical and non-compensable under the declared question. The
      result therefore qualifies as Robust Orientation within scope; survival
      under this burden does not establish final truth.
