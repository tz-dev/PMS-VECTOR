    understood: null
    praxis_available: null
    actor_response: null

  pressure:
    rivals:
      - >-
        A serious rival model exposes a low-resource counter-scene in which
        Procedure Y's apparent advantage depends on high resource availability.
        That rival defeats S0 and remains a live pressure against the revised S1,
        which the fixture states survives it under F_H and Q.
    counter_scenes:
      - >-
        Low-resource conditions: Procedure Y creates a critical regression,
        defeating the broad context-wide dominance claim S0.
      - >-
        Temporal pressure is applied to S1 after revision; the fixture states that
        S1 survives this pressure within its narrowed high-resource scope.
    provenance_dependencies:
      - >-
        PMS-VECTOR owns the fixed-baseline discipline, the explicit distinction
        Revision != Survival, and Revised Robust Orientation as a distinct result type.
      - >-
        The rival model is pressure supplied by the synthetic paper fixture; its
        success against S0 is not converted into endogenous VECTOR warrant.
    non_compensation: >-
      Later robustness of S1 cannot compensate for or erase the earlier collapse
      of S0. Improvement after revision is recorded as a new claim state, not as
      uninterrupted survival of the baseline.
    critical_open_tests: []

  result:
    status: Revised Robust Orientation
    surviving_claim: >-
      S1: Under high-resource conditions F_H, Procedure Y dominates Procedure X
      for the declared question Q. S1 survives the fixture's relevant role ROT,
      temporal pressure, and serious rival.
    revisions:
      - >-
        S0: Procedure Y dominates Procedure X across the relevant operating context -> Collapse.
      - >-
        S0 -> S1: the failed broad claim is materially revised to the narrower
        high-resource claim under F_H for Q.
      - >-
        S1 subsequently earns Revised Robust Orientation; this is not survival of S0.
    scope: >-
      The robust result is limited to S1 under high-resource conditions F_H and
      question Q. No robustness is attributed to S0 or to Y under low-resource
      or otherwise unspecified operating conditions.
    residue:
      - >-
        Any stronger claim beyond F_H and Q would require a new burden and cannot
        inherit S1's revised robustness automatically.
    stop_reason: >-
      The fixture has recorded the loss of S0, the material revision to S1, and
      S1's survival of the declared relevant role ROT, temporal pressure, and
      serious rival. That is sufficient for Revised Robust Orientation at the
      narrower scope while preserving Revision != Survival.
