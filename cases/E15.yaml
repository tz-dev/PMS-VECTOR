case_metadata:
  case_id: E15
  paper_ref: Appendix E.15
  title: '`OUGHT_constraint`'
  case_format: full_minimal_case
  adversarial:
    marked: false
    paper_label: null
  load_bearing: false
  pressure_families:
    - constraint_pressure
    - carriage_pressure
    - authority_boundary_pressure
  constructs_under_test:
    - OUGHT_constraint
    - ConstraintArchitecture
    - SystemCarriageRequired
  theoretical_function: >-
    Tests reconstruction of a maintained constraint and its effective response
    class without converting system carriage, source, or functional necessity
    into bearer authority or moral legitimacy.
  artifact_pair:
    yaml: cases/E15.yaml
    markdown: cases/E15.md
  architecture_effect:
    applies: false
    targets: []
    effect: null
  non_implications:
    - >-
      A response required for maintaining G is not thereby morally required.
    - >-
      The operative continuity condition G does not establish its own legitimacy
      or the moral status of the burdens generated by maintaining it.
    - >-
      While both X and Y remain in R_G, OUGHT_constraint(G,{X,Y}) does not select
      between them.
    - >-
      Revision or abandonment of G is a real branch, but Revision(G) is not a
      costless escape from praxis or from the consequences of changing the condition.

vector_record:
  reference:
    object: >-
      The maintained continuity condition G = critical service remains available
      during a regional outage, together with the effective response class that
      can still satisfy G after specified failures.
    object_type: constraint-relative effective-response-class claim

  frame:
    included:
      - The service provider maintains the explicit continuity condition G that critical service remains available during a regional outage.
      - Before the outage, several response paths can satisfy G.
      - Simultaneous equipment failure and loss of external supply narrow the effective response class.
      - Emergency backup X satisfies G in the post-failure scene.
      - Temporary reduction to a protected minimum Y satisfies G in the post-failure scene.
      - Routine operation Z no longer satisfies G in the post-failure scene.
      - A later failure variant removes Y, leaving R_G = {X}.
      - The institution may instead abandon or revise G by suspending the service entirely.
      - Revising G creates a new praxis situation with service loss, downstream exposure, legal or institutional consequences, and possible reversal costs.
    excluded:
      - Any inference from operative constraint to moral legitimacy or categorical duty.
      - Any automatic person-level assignment of the remaining system carriage burden.
      - Any selection between X and Y while both remain effective responses satisfying G.
      - Any representation of abandoning or revising G as costless or outside praxis.

  question:
    scope: >-
      While continuity condition G remains operative after the declared failures,
      what effective response class still satisfies G, and what constraint-relative
      practical necessity relation follows from that class?
    claim_ceiling: >-
      The case may reconstruct OUGHT_constraint(G,R_G) and, in the later singleton
      variant, practical necessity of X for maintaining G. It does not establish
      the legitimacy of G, moral obligation, person-level bearer authority, or a
      preferred choice between X and Y while both remain viable for G.

  position:
    perspective: >-
      The service-provider or institutional configuration maintaining the
      continuity condition, with bearer and legitimacy questions kept separate.
    temporal_position: >-
      The primary state is the post-failure outage scene. The later loss of Y and
      the revision/abandonment branch are explicit variants and are not silently
      folded into the same option-field state.
    scene_time: null
    analysis_time: null

  baseline_claim: >-
    Before the outage, several response paths can satisfy G. This is the baseline
    response field for contrast; the fixture does not assume that this field
    survives the later equipment and external-supply failures.

  dir:
    relation: null
    comparison_basis: null
    warrant:
      source_types: []
      external_premises: []
      unresolved_dependencies: []
    critical_regressions: []

  calibration:
    threshold: null
    basis: null
    domain_source: null
    competing_calibration: null
    unresolved: null

  rot_profile:
    applied: []
    untested_relevant: []
    stop_basis: >-
      No ROT is applied in this fixture. The discrimination is carried by the
      declared change in the effective response field, the constraint assignment
      audit, and the source/legitimacy boundary.

  dist_derived:
    effective_separation: null
    source_relations: []
    role_variation: null

  reversibility:
    available: >-
      G is revisable in the fixture: the institution can abandon or revise the
      continuity condition by suspending the service entirely.
    rotation_cost: null
    reversal_cost: >-
      Possible reversal costs are part of the revision variant, but the fixture
      supplies no universal magnitude or scalar cost.
    restoration_possible: null

  option_space:
    actor_or_role: >-
      The service provider or institution maintaining G; no specific individual
      bearer is selected by the fixture.
    options:
      - option: X — use the emergency backup system.
        status: structurally_viable
        evidence_status: >-
          The paper fixture directly includes X in the effective response class
          satisfying G after the simultaneous failures.
        authority: null
        access: null
        means: >-
          The emergency backup system is the operative means specified for X.
        information: null
        window: >-
          X remains in the effective response class during the declared outage scene.
        dependencies: []
        practical_control: null
        relevant_cost: null
        procedural_permission: null
        viability_relative_to: >-
          X satisfies the maintained continuity condition G in the current post-failure scene.
      - option: Y — temporarily reduce service to a protected minimum.
        status: structurally_viable
        evidence_status: >-
          The paper fixture directly includes Y in the effective response class
          satisfying G after the simultaneous failures.
        authority: null
        access: null
        means: >-
          The protected-minimum service mode is the operative response specified for Y.
        information: null
        window: >-
          Y remains viable in the primary post-failure scene but is removed by
          the paper's later failure variant.
        dependencies: []
        practical_control: null
        relevant_cost: null
        procedural_permission: null
        viability_relative_to: >-
          Y satisfies G in the primary scene; after the later failure it no longer belongs to R_G.
      - option: Z — continue routine operation.
        status: visible
        evidence_status: >-
          The fixture establishes that routine operation Z no longer satisfies G;
          it does not separately need to establish Z's practical status for a
          different question.
        authority: null
        access: null
        means: null
        information: null
        window: null
        dependencies: []
        practical_control: null
        relevant_cost: null
        procedural_permission: null
        viability_relative_to: >-
          Z does not satisfy G after the simultaneous failures and is therefore
          excluded from the effective response class R_G for this bounded question.
    option_invisibility: null
    option_illusion: null
    special_case_probes: []

  transformability:
    actor_configuration: >-
      The institution or service-provider configuration that maintains G and is
      explicitly able in the fixture to revise or abandon it.
    target_change: >-
      Revise or abandon continuity condition G, including complete service suspension.
    mechanism: >-
      Institutional revision or abandonment of the maintained continuity condition.
    authority_capacity: >-
      The fixture states that the institution can revise or abandon G; this does
      not independently establish the legitimacy of G or of that institutional authority.
    dependencies: []
    window: null
    evidence: >-
      The revision branch is explicitly supplied by Appendix E.15 rather than
      inferred as a hidden escape route.
    node_changes: []
    relation_changes:
      - Revision(G) => new constraint claim.

  consequence_topology:
    items:
      - type: service loss
        bearer: null
        temporal_relation: >-
          Follows the revision branch in which the institution suspends the service entirely.
        mechanism_source: abandonment or revision of G through service suspension
        evidence_status: directly established by the synthetic revision variant
      - type: downstream exposure
        bearer: null
        temporal_relation: downstream of service suspension
        mechanism_source: revision or abandonment of the continuity condition
        evidence_status: fixture-specified consequence relation; magnitude not supplied
      - type: legal or institutional consequence
        bearer: null
        temporal_relation: downstream of revision or service suspension
        mechanism_source: external legal or institutional relations where applicable
        evidence_status: hypothetical / externally supported where required
    unknown_residue: >-
      Exact magnitudes, bearer distribution, legal basis, and other downstream
      consequences are not supplied and are not converted into a universal cost scalar.

  constraint:
    G: critical service remains available during a regional outage
    maintained_by: the service provider / institution in the paper fixture
    modifiable_by: >-
      The institution; the revision variant explicitly allows abandonment or revision of G.
    claimed_authority: null
    burden_bearers: []
    exit_relations:
      - >-
        The institution may abandon or revise G by suspending the service entirely;
        this is a new praxis branch rather than a costless escape.
    alternative_carriers: []
    transformation_routes:
      - Revision or abandonment of G by the institution, producing a new constraint claim.
    abandon_or_revision_consequences:
      - service loss
      - downstream exposure
      - legal or institutional consequences
      - possible reversal costs
    unknowns:
      - The fixture does not assign the system-level carriage requirement to a specific person.
      - Exact burden distribution across affected roles is not established.
      - Exact magnitude and domain basis of revision consequences are not established.
    external_legitimacy_question: >-
      Whether G is legitimate, justified, authorized, desirable, legally binding,
      or morally binding remains external to VECTOR unless separately warranted.

  orientation_uptake:
    presented: null
    actor_accessible: null
    understood: null
    praxis_available: null
    actor_response: null

  pressure:
    rivals: []
    counter_scenes: []
    provenance_dependencies:
      - >-
        PMS-CONFLICT supplies a lineage precedent that infrastructure-coupled
        continuity can make carriage non-optional at system level while refusing
        the inference that a particular person morally ought to carry the load.
      - >-
        PMS-VECTOR owns OUGHT_constraint as a general claim type, the effective
        response-class reconstruction, and the constraint-assignment and
        source/legitimacy boundaries applied in E15.
      - >-
        The existence of an operative G or a remaining response class does not
        manufacture external legitimacy, legal authority, or moral warrant.
    non_compensation: null
    critical_open_tests: []

  result:
    status: Bounded Orientation
    surviving_claim: >-
      In the primary post-failure scene, the effective response class satisfying
      the maintained condition is R_G = {X,Y}, so VECTOR may record
      OUGHT_constraint(G,{X,Y}) without selecting between X and Y. In the later
      failure variant, R_G = {X}, making X practically necessary for maintaining
      G under that variant's current conditions.
    revisions:
      - >-
        The material change from the pre-outage scene to the post-failure scene
        produces a new response-class claim R_G = {X,Y}; it is not automatic
        survival of the earlier response field.
      - >-
        The later failure variant produces another scene-state claim R_G = {X};
        this narrows practical necessity for G without converting it into moral obligation.
    scope: >-
      The result is conditional on G remaining operative and on the declared
      post-failure option field. It reconstructs constraint-relative practical
      necessity only; it does not establish legitimacy of G, person-level duty,
      or a preferred choice between X and Y while both satisfy G.
    residue:
      - >-
        Revision or abandonment of G remains a real branch but produces a new
        constraint claim and a different consequence topology rather than a costless escape.
      - >-
        Person-level burden assignment, fairness, legitimacy, and external legal
        or institutional authority remain unresolved or externally warranted.
    stop_reason: >-
      The fixture supplies an operative G, a non-empty effective response class
      whose members satisfy G, and an explicit revision branch. This is sufficient
      for the bounded constraint relation while the moral and authority boundaries remain open.
