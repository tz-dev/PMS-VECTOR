  pressure:
    rivals: []
    counter_scenes: []
    provenance_dependencies:
      - >-
        PMS-VECTOR owns the general DIR / ROT architecture and the E02 collapse
        claim; ROT is not inherited from another PMS add-on operation.
      - >-
        PMS-STRATA supplies a lineage precedent for non-compensatory claim
        discipline, but E02's concrete non-compensation relation is carried by
        the declared case question and its claim-critical regression rather than
        inherited as independent VECTOR warrant.
    non_compensation: >-
      The project-level delivery gain does not compensate for the coordinator's
      unrecorded interruption load, after-hours work, and lost project capacity
      because the declared question itself requires sustainable coordination
      without hidden critical load.
    critical_open_tests: []

  result:
    status: Revision Required
    surviving_claim: >-
      The observed smoother delivery, lower meeting load, and rapid failure
      resolution under Arrangement Y remain part of the scene, but they no
      longer warrant the original superiority relation for the declared
      sustainable-coordination question.
    revisions:
      - 'Initial DIR: X ≺_{V,C} Y -> Collapse.'
      - >-
        No replacement DIR is established within this fixture; any modified
        coordinator arrangement with explicit capacity protection would be a new
        claim requiring its own test.
    scope: >-
      The collapse is bounded to Arrangement X versus the original Arrangement Y
      in the declared project, time interval, and sustainable-coordination
      question.
    residue:
      - >-
        A redesigned coordinator role with explicit capacity protection may be a
        legitimate new comparison candidate, but it is not evaluated here.
    stop_reason: >-
      The materially relevant affected-role ROT exposes a non-compensable,
      claim-critical regression in the baseline relation. The responsible result
      is Revision Required after DIR collapse, not preservation of the original
      claim through a post hoc redesign.
