# =============================================================================
# PMS-VECTOR — APPENDIX E CASE INDEX
# =============================================================================
#
# Role:
#   Paper-linked inventory and Reader navigation registry for Appendix E.
#
# Boundary:
#   index = inventory / navigation
#   case YAML = structured case record
#   case Markdown = human-readable case companion
#   paper = theoretical authority
#
#   case count != evidential weight
#   case suite != empirical validation
#   case outcome != VECTOR validity
#
# Pressure-family labels below are navigational classifications, not a new
# theoretical taxonomy. Local case results and architecture effects belong in
# the individual case artifacts, not in this index.
# =============================================================================

case_index:
  meta:
    artifact: PMS-VECTOR Appendix E Case Index
    role: paper-linked inventory and Reader navigation registry
    paper_source: PMS-VECTOR.md — Appendix E
    case_template: model/Case.template.yaml
    vector_record_template: model/VECTOR-Record.template.yaml
    model_reference: model/PMS-VECTOR.yaml
    hard_pms_dependency: PMS.yaml
    paper_linked_case_count: 23
    case_count_is_evidence_weight: false
    case_suite_is_empirical_validation: false
    index_is_theoretical_authority: false
    pressure_families_are_navigation_labels: true
    case_template_is_strict_validation_schema: false
    template_change_reclassifies_existing_cases: false
    constructs_under_test_are_validation_claims: false
    local_case_result_stored_here: false
    architecture_effect_stored_here: false
    notes:
    - The index inventories Appendix E; case YAML files carry structured case content.
    - Pressure-family labels support navigation and do not constitute a new theoretical taxonomy.
    - Template evolution does not itself update, validate, or reclassify existing paper-linked case artifacts; substantive case synchronization requires case-level review.
    - A collapse, rival victory, suspension, reduction, or Non-Capture may be the correct discriminative case result.
    - case count != evidential weight
    - case suite != empirical validation
  formats:
    full_minimal_case: Develops enough structure to show why the output changes.
    micro_countercase: Isolates a tempting misclassification and the correction VECTOR must make.
