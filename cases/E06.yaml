case_metadata:
  case_id: E06
  paper_ref: Appendix E.6
  title: Missed Window under Excessive Delay / Preserved Analytical Distance
  case_format: micro_countercase
  adversarial:
    marked: false
    paper_label: null
  load_bearing: false
  pressure_families:
    - timing_window_pressure
    - option_status_pressure
    - dist_pressure
  constructs_under_test:
    - Timing
    - OptionSpace
    - DIST
  theoretical_function: >-
    Tests whether continued analysis can destroy a real option window, whether
    Deferred/Lost remain branch statuses distinct from option-status predicates,
    and whether preserved analytical distance must remain distinct from preserved
    practical possibility.
  artifact_pair:
    yaml: cases/E06.yaml
    markdown: cases/E06.md
  architecture_effect:
    applies: false
    targets: []
    effect: null
  non_implications:
    - Delay does not by itself preserve a practical option.
    - Wider derived DIST does not imply higher adequacy.
    - A lost option after the deadline does not retroactively establish fault, earlier awareness, or earlier effective capacity beyond what the fixture supplies.

vector_record:
  reference:
    object: >-
      Continued review of a reversible pilot whose extension branch is available
      only before a contractual deadline.
    object_type: temporal option-window claim

  frame:
    included:
      - The team keeps a reversible pilot under review for one more round of analysis.
      - The pilot can be extended only before a contractual deadline.
      - The additional review adds little new pressure.
      - The contractual deadline passes while review continues.
      - The formerly available extension branch moves from Deferred to Lost.
    excluded:
      - Any inference that continued analytical distance preserves the practical extension option.
      - Any inference that wider derived DIST is automatically better or more adequate.
      - Any retrospective inference of fault, awareness, or effective capacity beyond the case conditions supplied.
      - Any universal rule that delay is always harmful.

  question:
    scope: >-
      Does one more round of low-yield review preserve the pilot-extension option
      when that branch exists only before a contractual deadline?
    claim_ceiling: >-
      The fixture may record the deadline-driven transition from Deferred to Lost
      and reject the equation of delay with preservation. It does not establish
      universal timing fault, an optimal action point, or the permanent impossibility
      of every future alternative.

  position:
    perspective: >-
      Team-level analysis of the pilot-extension branch across the supplied
      pre-deadline review period and the post-deadline state.
    temporal_position: >-
      The case explicitly spans a pre-deadline state in which extension remains
      available and a post-deadline state in which that branch has been lost.
    scene_time: null
    analysis_time: null

  baseline_claim: >-
    Candidate S_0: because the pilot remains reversible and the team is keeping
    analytical distance through another review round, delaying the extension
    decision preserves the practical option to extend the pilot.

