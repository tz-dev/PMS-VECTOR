  result:
    status: Revision Required
    surviving_claim: >-
      Continued analysis may preserve analytical separation, but it does not
      preserve the pilot-extension option after the contractual deadline. The
      supplied extension branch has moved from Deferred to Lost.
    revisions:
      - >-
        The baseline equation of continued delay with practical preservation is
        rejected. Timing must be tracked through the actual option relation, not
        inferred from preserved analytical distance or pilot reversibility alone.
    scope: >-
      Limited to the supplied reversible-pilot scene, its contractual extension
      deadline, and the low-yield additional review round that continues until the deadline passes.
    residue:
      - The fixture does not establish whether another materially different future option could later emerge.
      - The fixture does not establish actor fault or retrospective awareness from the fact of window closure alone.
    stop_reason: >-
      The micro-countercase closes when the practical branch transition is explicit:
      continued review added little pressure, the contractual deadline passed,
      and the formerly available extension branch became Lost. Preserved analytical
      distance therefore cannot be counted as preserved practical possibility.
