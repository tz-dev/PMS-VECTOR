  result:
    status: Incomparable
    surviving_claim: >-
      The comparison is meaningful, but no warranted dominance relation between
      X and Y has been earned under the declared conditions: X ∥_{V,C} Y.
    revisions: []
    scope: >-
      Limited to the declared emergency-procedure comparison, its two supplied
      non-substitutable aims, and the absence of a warranted priority relation between them.
    residue:
      - The procedures remain materially different despite the absence of warranted rank.
      - No priority relation between the two aims is supplied by the fixture.
    stop_reason: >-
      The micro-countercase closes once the meaningful comparison, absence of
      warranted dominance, and non-equivalence between incomparability and equality are preserved.
