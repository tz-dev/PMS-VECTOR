  - option_status_pressure
  constructs_under_test:
  - DistributedAgency
  - SecondOrderAgency
  - EffectiveCapacity
  - OptionBlindness
  - OptionFieldMisrepresentation
  theoretical_function: Tests whether an individual-only actor model can produce Option Blindness by excluding a transformation that is effectively available at a coordinated actor configuration while preserving the distinction between distributed capacity and individual responsibility.
  artifact_pair:
    yaml: cases/E12.yaml
    markdown: cases/E12.md
  architecture_effect:
    applies: false
    targets: []
    effect: null
  non_implications:
  - Distributed collective capacity does not imply equal individual capacity.
  - Distributed collective capacity does not imply equal or undifferentiated individual responsibility.
  - Option Blindness in the individual-only reconstruction does not establish actor fault, blame, obligation, or equal responsibility.
  - This fixture does not establish that every apparently blocked transformation is collectively reachable.
vector_record:
  reference:
    object: The coordinated capacity of three departments to authorize, fund, and implement a needed change that no department can produce alone.
    object_type: distributed Second-Order Agency / effective-capacity configuration claim
  frame:
    included:
    - No individual department can by itself authorize, fund, and implement the needed change.
    - Three departments acting together can produce the needed change.
    - Each individual unit falls below the relevant capacity requirement while the coordinated configuration meets it.
    excluded:
    - Any inference that each department individually possesses the collective capacity.
    - Any inference that collective capacity distributes responsibility equally across the individual departments.
  question:
    scope: Can an individual-only actor model produce Option Blindness by excluding a needed transformation even though the coordinated multi-department configuration has sufficient effective capacity to produce it?
    claim_ceiling: The case can establish distributed Second-Order Agency and an unsupported exclusion in the individual-only reconstruction. It cannot infer equal individual capacity, equal / undifferentiated individual responsibility, or a general rule that distributed capacity always exists.
  position:
    perspective: Analysis of the effective capacity of each department separately and of the coordinated three-department configuration.
    temporal_position: The fixture concerns the same bounded transformation requirement for the individual and coordinated capacity comparisons.
    scene_time: null
    analysis_time: null
  baseline_claim: Because Capacity(a_i) < Requirement for every individual department, no effective transformation route is available for the needed change.
