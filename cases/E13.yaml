    options: []
    option_invisibility: null
    option_field_misrepresentation:
      blindness:
        unsupported_exclusions: []
      illusion:
        unsupported_inclusions: []
    special_case_probes: []

  transformability:
    actor_configuration: null
    target_change: null
    mechanism: null
    authority_capacity: null
    dependencies: []
    window: null
    evidence: null
    node_changes: []
    relation_changes: []

  consequence_topology:
    items:
      - type: delayed / downstream cost
        bearer: The service that depends on the deferred-maintenance component.
        temporal_relation: >-
          Future outage risk connected to the present maintenance deferral.
        mechanism_source: >-
          A documented failure mode remains active, and the supplied technical
          record traces the dependency from deferred repair to later outage risk.
        evidence_status: traceably_inferred
    unknown_residue: >-
      Scene B remains unknown_or_residual: an unspecified possible downstream
      cost is mentioned, but no bearer, mechanism, temporal relation, or
      external support is supplied. It is therefore preserved as residue rather
      than inserted into consequence_topology.items as a positive cost claim.

  constraint:
    G: null
    maintained_by: null
    modifiable_by: null
    claimed_authority: null
    burden_bearers: []
    exit_relations: []
    alternative_carriers: []
    transformation_routes: []
    abandon_or_revision_consequences: []
    unknowns: []
    external_legitimacy_question: null

  orientation_uptake:
    presented: null
    actor_accessible: null
    understood: null
    praxis_available: null
    actor_response: null

  pressure:
    rivals: []
    counter_scenes:
      - >-
        Scene B functions as the contrast case: downstream-cost language is
        present, but the claim lacks the bearer, temporal relation,
        mechanism/source, and evidential bridge supplied in Scene A.
    provenance_dependencies:
      - >-
        PMS-SEX supplies a local lineage precedent that downstream effects can
        persist and matter across time, but it does not warrant any specific
        hidden cost in E13.
      - >-
        PMS-VECTOR owns the explicit consequence-evidence statuses, the
        Unknown/Residual anti-inflation rule, and the E13 discrimination between
        traceably inferred cost and invented hidden cost.
      - >-
        Provenance does not convert a downstream-cost precedent into evidence
        for Scene B; the positive cost burden remains claim-specific.
    non_compensation: null
    critical_open_tests:
      - >-
        Scene A preserves uncertainty about magnitude and exact timing; a
        stronger quantitative or directional claim would require additional
        support.
      - >-
        Scene B can motivate further inquiry, but it remains Unknown/Residual
        until a bearer, temporal relation, mechanism/source, and evidential
        bridge are supplied. Unknown/Residual here is a consequence-evidence
        status and does not by itself license any option-status inference.

  result:
    status: Revision Required
    surviving_claim: >-
      Scene A may carry a delayed/downstream consequence as traceably inferred
      because the bearer, temporal relation, mechanism, and evidential bridge
      are supplied. Scene B does not support a positive cost assertion and
      remains Unknown/Residual.
    revisions:
      - >-
        The baseline rule that unseen downstream possibility can be carried as a
        positive cost in both scenes is rejected.
      - >-
        Scene A is retained as a traceably inferred consequence relation, while
        Scene B is retyped as unknown_or_residual rather than as a positive item.
    scope: >-
      The result is limited to evidence-status typing of the supplied downstream
      relations. It does not establish Scene A's exact magnitude or timing and
      does not derive a DIR, option ranking, or aggregate total-cost conclusion.
    residue:
      - >-
        Scene A retains uncertainty about magnitude and precise timing despite
        the traceable downstream relation.
      - >-
        Scene B remains unresolved residue that may justify further inquiry but
        supplies no current positive cost evidence.
    stop_reason: >-
      The fixture supplies enough relation structure to classify Scene A as
      traceably inferred and enough absence of relation structure to refuse a
      positive cost claim in Scene B. Further inquiry may refine either scene,
      but no hidden-cost assertion is licensed by the current residue.
