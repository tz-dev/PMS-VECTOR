case_metadata:
  case_id: E09
  paper_ref: Appendix E.9
  title: Special-Case Probe Produces Orientation
  case_format: micro_countercase
  adversarial:
    marked: false
    paper_label: null
  load_bearing: false
  pressure_families:
  - special_case_probe_pressure
  - frame_pressure
  - option_status_pressure
  constructs_under_test:
  - OptionSpace
  - DIR
  - Frame
  theoretical_function: Tests whether a special-case probe can identify the asymmetry blocking a current option without converting the hypothetical option into present availability or treating analytic construction as Option Illusion unless unsupported inclusion actually occurs.
  artifact_pair:
    yaml: cases/E09.yaml
    markdown: cases/E09.md
  architecture_effect:
    applies: false
    targets: []
    effect: null
  non_implications:
  - A shared procedure that is viable under F* does not thereby belong to the current option field under F0.
  - Invalid as a current option does not imply invalid as an analytic probe.
  - Orientation gain from the frame contrast does not imply an option-status change in the original frame.
  - Analytic construction does not by itself constitute Option Illusion; unsupported inclusion into the current effective option field would be required.
vector_record:
  reference:
    object: The special-case comparison between the current conflict frame F0 and a counterfactual frame F* in which both parties have equal decision authority.
    object_type: special-case probe / frame-contrast orientation claim
  frame:
    included:
    - Under the current frame F0, the conflict has no viable shared procedure.
    - The analyst constructs F* by assuming equal decision authority for both parties.
    - Under F*, a shared procedure becomes viable.
    - The frame contrast identifies the operative authority asymmetry that blocks the shared procedure under F0.
    excluded:
    - Any transport of the shared procedure from F* into F0 as a current effective option.
    - Any claim that the counterfactual itself changes the current effective option field.
    - Any claim of same-claim robustness merely because the special case yields orientation.
  question:
    scope: Can the declared special-case frame F* increase bounded orientation about what blocks a shared procedure in F0 without increasing the current effective option field?
    claim_ceiling: The case can identify a blocking asymmetry through the declared frame contrast. It cannot establish that the shared procedure is currently available, actionable, or viable under F0.
  position:
    perspective: Analyst-facing comparison of F0 with the explicitly modified special-case frame F*.
    temporal_position: The probe is evaluated against the current conflict conditions represented by F0.
    scene_time: null
    analysis_time: null
  baseline_claim: The special-case construction F* may be used to identify the operative blocking condition in F0, but the shared procedure that becomes viable under F* is not thereby a current option under F0.
  dir:
    relation: 'Bounded orientation from the frame contrast: unequal decision authority is identified as the operative asymmetry blocking the shared procedure under F0.'
    comparison_basis: Declared contrast between F0 and F*, changing the decision-authority condition while asking what difference that alteration makes to shared-procedure viability.
