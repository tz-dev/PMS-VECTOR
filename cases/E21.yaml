  pressure:
    rivals:
      - >-
        A calibrated domain-specific queueing model supplied with measured arrival
        rates, service-time distributions, and staffing limits. It produces
        out-of-sample predictions for queue delay that discriminate the candidate
        schedules directly while remaining in its own technical vocabulary.
    counter_scenes: []
    provenance_dependencies:
      - >-
        PMS Base governs PMS operator semantics and does not warrant VECTOR ownership
        of specialist technical burdens.
      - >-
        PMS-VECTOR requires serious rivals to retain real winning conditions and
        records E21 as specialist-domain deference rather than same-burden DIR–ROT
        scope reduction.
      - >-
        The queueing model's calibration and predictive discrimination remain
        external domain warrant; translating the rival result into VECTOR notation
        would not make that warrant endogenous to VECTOR.
    non_compensation: null
    critical_open_tests: []

  result:
    status: Bounded Orientation
    surviving_claim: >-
      For the declared queue-delay minimization burden, the calibrated domain-specific
      queueing model should carry primary analytic status and VECTOR should yield
      locally. VECTOR may still address broader role, option, consequence, legitimacy,
      or attribution questions only when those become part of a different declared
      burden.
    revisions:
      - >-
        Baseline claim to primary VECTOR ownership for the specialist queue-delay
        task -> local domain-task deference to the calibrated queueing model.
    scope: >-
      The result is restricted to the narrow specialist burden of minimizing expected
      queue delay under the supplied measured distributions and fixed staffing
      constraint. It does not enact architecture-level narrowing of DIR, ROT, or
      Standalone VECTOR.
    residue:
      - >-
        Questions about legitimacy, burden distribution, option-field legibility or
        misrepresentation, role-specific costs, and practical attribution remain outside the rival's declared technical
        objective.
      - >-
        Local specialist superiority does not establish that the queueing model is
        superior for broader or same-burden orientation questions.
    stop_reason: >-
      The calibrated domain-specific rival performs the declared technical
      discrimination more directly and with stronger task-specific calibration, while
      VECTOR's broader machinery does not improve the queue-delay prediction for this
      question. The responsible result is local domain-task deference, not rival
      assimilation or E23-style core scope reduction.
