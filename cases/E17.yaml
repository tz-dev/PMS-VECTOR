    provenance_dependencies:
      - >-
        PMS-CONFLICT supplies the lineage that a fixpoint requirement can arise
        where integration fails but continuity or output remains required, and
        that the function may be carried by a person, role, procedure, or institutional mechanism.
      - >-
        PMS-VECTOR makes the audit boundary explicit as
        FixpointRequirement != BearerAuthority.
