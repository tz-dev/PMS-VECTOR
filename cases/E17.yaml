case_metadata:
  case_id: E17
  paper_ref: Appendix E.17
  title: Fixpoint without Authority
  case_format: micro_countercase
  adversarial:
    marked: false
    paper_label: null
  load_bearing: false
  pressure_families:
    - fixpoint_pressure
    - authority_boundary_pressure
  constructs_under_test:
    - FixpointRequirement
    - BearerAuthority
  theoretical_function: >-
    Tests whether a functional fixpoint requirement can be real while failing to
    establish unique bearer authority.
  artifact_pair:
    yaml: cases/E17.yaml
    markdown: cases/E17.md
  architecture_effect:
    applies: false
    targets: []
    effect: null
  non_implications:
    - >-
      FixpointRequirement does not imply BearerAuthority.
    - >-
      The need for some stabilizing fixpoint function does not establish that
      person A should rule or that one particular bearer is legitimate.

vector_record:
  reference:
    object: >-
      A coordination process that cannot reach joint integration but must still
      produce an operational output before a deadline.
    object_type: functional fixpoint-requirement claim

  frame:
    included:
      - Joint integration cannot be reached in the coordination process.
      - An operational output must still be produced before a deadline.
      - Some fixpoint function is therefore required for stabilization and output.
      - A rotating designated coordinator can carry the fixpoint function.
      - A pre-agreed escalation protocol can also carry the fixpoint function.
    excluded:
      - Any inference that the functional requirement itself establishes person A's authority to rule.
      - Any inference that a particular bearer is legitimate merely because a fixpoint function is required.
      - Any assumption that the fixpoint must be personified rather than carried by a role, procedure, or institutional mechanism.

  question:
    scope: >-
      Does the non-integrable but deadline-bound coordination process require a
      fixpoint function, and does that functional requirement establish authority
      for a particular bearer?
    claim_ceiling: >-
      The case may record FixpointRequirement and the existence of more than one
      possible carrier. It does not establish BearerAuthority, person A's right to
      rule, or the legitimacy of a particular fixpoint arrangement.

  position:
    perspective: >-
      The coordination system or institutional process that must produce an
      operational output despite failed joint integration.
    temporal_position: >-
      The bounded pre-deadline scene in which delay is no longer neutral and a
      stabilizing output function is required.
    scene_time: null
    analysis_time: null

  baseline_claim: >-
    Joint integration is unavailable while an operational output remains required
    before the deadline; therefore some fixpoint function is required. The case
    tests whether that functional necessity can be converted into authority for a
    particular bearer.

