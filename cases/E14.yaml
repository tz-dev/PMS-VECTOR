  orientation_uptake:
    presented: >-
      A later review produces and presents bounded relation R as a relevant
      consequence relation for the process.
    actor_accessible: >-
      Yes. The fixture states that R becomes accessible to the relevant actor or role.
    understood: >-
      Yes. R is understood sufficiently to be contested or acted on; agreement
      with R or with VECTOR is not required.
    praxis_available: >-
      Yes. R remains practically available inside the relevant scene-time window
      for verification, rejection, refusal, contest, or action.
    actor_response: null

  pressure:
    rivals: []
    counter_scenes: []
    provenance_dependencies:
      - >-
        PMS-LOGIC supplies the independent baseline relation: effective,
        frame-bound capacity and attributable consequence can support structural
        responsibility without a prescriptive ought and without requiring actor
        awareness as a VECTOR gate.
      - >-
        PMS-VECTOR owns the orientation-uptake chain, the distinction between
        BaselineAttributability_LOGIC and DeltaAttributability_orientation, and
        the claim type OUGHT_account.
      - >-
        External premise support remains external where required; provenance or
        notation does not manufacture the empirical, causal, legal, technical,
        historical, or capacity warrant on which R may depend.
    non_compensation: null
    critical_open_tests:
      - >-
        If relevant orientation, external support, uptake, effective capacity,
        consequence relation, or role/time conditions fail, the orientation-mediated
        attribution claim must reduce or suspend rather than being rescued by mere notification.

  result:
    status: Bounded Orientation
    surviving_claim: >-
      In the supplied fixture, the orientation-mediated dependency bundle carries:
      DeltaAttributability_orientation > 0 may be recorded and OUGHT_account(R)
      means that later praxis cannot erase R as though it had never become
      available for response. The independent PMS-LOGIC baseline remains separate.
    revisions: []
    scope: >-
      The result is bounded to relation R, the declared role/process relation,
      the supplied external support, and the relevant scene-time conditions. It
      neither selects an outcome nor establishes moral, legal, or decision authority.
    residue:
      - >-
        The general calibration threshold remains non-universal and domain-sensitive.
      - >-
        The actor's eventual response remains open: contest, rejection, refusal,
        another practical branch, or action are not decided by OUGHT_account.
    stop_reason: >-
      The fixture explicitly supplies the dependencies required for the bounded
      orientation-mediated uplift while preserving the BeingTold/Uptake and
      LOGIC-baseline boundaries. No stronger choice or moral claim is licensed.
