  orientation_uptake:
    presented: null
    actor_accessible: null
    understood: null
    praxis_available: null
    actor_response: null

  pressure:
    rivals: []
    counter_scenes:
      - >-
        Scene A and Scene B are matched on bounded DIR, nominal time interval,
        and substantial PMS Χ distance, while differing in Ψ self-binding,
        public reliance, Θ review-window openness, and available reversibility.
    provenance_dependencies:
      - >-
        PMS Base owns Χ, Θ, Ψ, Ω, and Α semantics; VECTOR-DIST is not identical
        to PMS Χ.
      - >-
        PMS-CRITIQUE carries materially relevant distance/interruption,
        review-window, publicness, and correction pressure; those source
        relations do not make DIST a CRITIQUE operation or an inherited warrant.
      - >-
        PMS-VECTOR owns the reduction claim that DIST is supporting only after
        the E22 / Chapter 19.5 redundancy test.
    non_compensation: >-
      Convenience of the DIST shorthand cannot compensate for failure to add
      independent discrimination or warrant beyond its source relations.
    critical_open_tests: []

  result:
    status: Revision Required
    surviving_claim: >-
      The practical orientation–enactment distinction survives: the affected-role
      ROT remains pre-enactment actionable in Scene A and primarily
      reversal/correction-relevant in Scene B.
    revisions:
      - 'DIST: core_component -> derived_supporting_only'
      - 'VECTOR core: <DIR, ROT, DIST> -> <DIR, ROT>'
    scope: >-
      DIST remains usable only as a derived supporting descriptor whose strong
      claims stay reducible to the source relations that generate effective
      orientation–enactment separation.
    residue:
      - >-
        DIST may remain useful as compact prose or case-comparison shorthand,
        but it carries no independent core warrant.
      - >-
        Reversibility remains a distinct supporting dependency architecture;
        DIST is not REV_avail and correction does not imply restoration.
    stop_reason: >-
      The declared architecture-necessity test is resolved by loss without
      protective reinterpretation: removing DIST does not remove the practical
      discrimination, so the core-status claim is reduced while the underlying
      source relations remain available.
