result_types:
  status: "non_hierarchical_result_set"
  automatic_confidence_score: false

  values:
    robust_orientation:
      label: "Robust Orientation"
      meaning: >
        The claim-relevant core survives materially relevant current pressure
        without material revision, within declared scope.
      scope_required: true

    revised_robust_orientation:
      label: "Revised Robust Orientation"
      meaning: >
        The baseline materially failed, a revised claim was produced, and the
        revised claim subsequently survived the relevant pressure.

    bounded_orientation:
      label: "Bounded Orientation"
      meaning: >
        Sufficient directional support exists for the declared question without
        earning stronger robustness status.

    revision_required:
      label: "Revision Required"
      meaning: >
        The current claim does not survive, but a materially altered claim may
        be testable; the revision has not yet earned robust status.

    trade_off:
      label: "Multidirectional / Trade-Off"
      meaning: >
        Several relevant directional relations survive but no legitimate
        non-compensatory resultant is warranted.

    incomparable:
      label: "Incomparable"
      meaning: >
        A meaningful comparison space exists but no warranted dominance
        relation has been earned.

    suspend:
      label: "Suspend"
      meaning: >
        The question remains legitimate but current warrant is insufficient.
      reentry_possible: true

    non_capture:
      label: "Non-Capture"
      meaning: >
        VECTOR should not produce the requested directional relation in the
        current form.
      positive_discriminative_outcome: true

  excluded_results:
    - "AbsoluteTruth"
    - "CertifiedCorrect"
    - "FinalPosition"

claim_discipline:
