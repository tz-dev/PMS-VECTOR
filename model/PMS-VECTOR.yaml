#
#    Inspectable without PMS.yaml != valid PMS–VECTOR application.
#    Machine-readable consistency != theoretical adequacy.
#    VECTOR robustness != external warrant.
# =============================================================================

pms_dependency_gate:
  requirement: >
    PMS–VECTOR is a late meta-reconstructive orientation theory built in
    explicit dependency on the Praxeological Meta-Structure. This profile may
    be inspected as a repository artifact on its own, but its PMS operator
    references, PMS application validity, and PMS-conformity claims are not
    semantically complete unless the required PMS.yaml base specification is
    resolved. VECTOR does not duplicate or replace the Base operator grammar.

  hard_dependency:
    model_name: "Praxeological Meta-Structure"
    model_short: "PMS"
    source_file: "PMS.yaml"
    expected_schema_version: "PMS_1.3"
    resolution_required: true
    semantic_authority: "external_governing_base"

  required_base_bindings:
    - pointer: "PMS.yaml#/pms_entry_condition"
      role: "PMS application entry condition"
    - pointer: "PMS.yaml#/repository_governance"
      role: "Base / overlay governance boundary"
    - pointer: "PMS.yaml#/pms_model_reference/meta_axioms"
      role: "Δ–Ψ operator identity, order, dependency, and semantics"
    - pointer: "PMS.yaml#/computational_representation"
      role: "Base computational restraint and implementation boundary"

  resolution_policy:
    inspectable_without_pms: true
    application_valid_without_pms: false
    pms_conformity_claim_valid_without_pms: false
    operator_semantics_complete_without_pms: false
    vector_specific_constructs_visible_without_pms: true
    failure_state_if_unresolved: "pms_dependency_unresolved"

  prohibited_if_unresolved:
    - "claiming a valid PMS–VECTOR application"
    - "treating local operator labels as self-contained operator definitions"
    - "claiming PMS-conformity"
    - "deriving PMS operator dependencies from this file alone"
    - "using this profile as a replacement PMS base grammar"

  critique_boundary: >
    The dependency gate constrains PMS–VECTOR application and PMS-conformity
    claims. It does not prohibit criticism, rejection, revision proposals, or
    rival formalizations that inspect VECTOR without accepting PMS.

  conditional_base_bindings:
    - pointer: "PMS.yaml#/derived_structures"
      role: "Base-derived structure reference only where explicitly invoked by a VECTOR claim"
      resolution_required: false
schema_version: "PMS-VECTOR_1.0"

schema_meta:
  model_name: "PMS–VECTOR"
  model_short: "PMS-VECTOR"
  title: "Direction and Rotation"
  subtitle: >
    Praxeological Orientation under Perspectival Freedom, Reversibility, and
    Transformable Possibility
  status: "draft_repository_reference"
  maturity: "paper_complete_repository_formalization_in_progress"
  repository_role: "pms_bound_meta_reconstructive_orientation_profile"
  last_updated: "2026-08-17"

  depends_on:
    model_name: "Praxeological Meta-Structure"
    model_short: "PMS"
    source_file: "PMS.yaml"
    schema_version: "PMS_1.3"
    dependency_type: "hard_semantic_dependency"
    required_for_valid_application: true

  authors:
    - name: "T. Zöller"
      role: "originator"
    - name: "ChatGPT (GPT-5.6 Sol)"
      role: "repository_formalization_assistant"

  paper_source:
    source_file: "PMS-VECTOR.md"
    authority_role: "primary_vector_theoretical_source"
    model_may_mirror_but_not_expand_theory: true

  epistemic_status: >
    PMS–VECTOR is a bounded, revisable, rival-sensitive orientation theory. It
    does not claim finality, universal rank, moral decision authority, complete
    capture, or guaranteed superiority to rival methods. Its current
    standalone status is provisional retain with scope reduction under the
    same-burden rival demonstrated in Appendix E.23.

  description: >
    VECTOR reconstructs when structural differences may support bounded
    directional claims, how such claims change under admissible perspectival
    pressure, how orientation relates to transformable possibility,
    consequence, timing, uptake, and structural attributability, and how the
    theory itself must reduce when components or scope fail their burden.

  claim_type:
    - "late"
    - "meta-reconstructive"
    - "praxeological"
    - "orientation"

  methodological_restraint: >
    VECTOR must remain vulnerable to revision, non-capture, component
    reduction, scope reduction, domain deference, and standalone reduction.
    Internal coherence, successful formalization, case coverage, reader
    consistency, or PMS lineage do not establish external warrant or theory
    superiority.

  intended_use:
    allowed_profiles:
      - "theoretical_orientation_analysis"
      - "bounded_structural_comparison"
      - "perspectival_pressure_testing"
      - "option_and_constraint_analysis"
      - "rival_sensitive_theory_comparison"
      - "praxeological_case_audit"
      - "machine_readable_repository_reference"
    not_intended_for:
      - "universal_person_ranking"
      - "personality_typing"
      - "clinical_or_diagnostic_use"
      - "automated_moral_judgement"
      - "automatic_legal_or_policy_authorization"
      - "automatic_blame_or_liability_assignment"
      - "metric_vector_scoring_without_domain_calibration"
      - "replacement_of_specialist_methods_by_default"
      - "self_certification_of_pms_or_vector"

repository_governance:
  role_of_this_file: >
    PMS-VECTOR.yaml is the repository reference profile for the VECTOR paper.
    It records VECTOR-specific architecture, status boundaries, result types,
    reduction conditions, and machine-readable references while remaining
    subordinate to PMS.yaml for PMS Base semantics and to PMS-VECTOR.md for
    VECTOR theory content.

  typed_authority:
    pms_base_semantics:
      authority: PMS.yaml
      governs:
        - PMS entry condition
        - PMS meta-axiom identity and semantics
        - PMS operator dependency path
        - Base / overlay repository governance
    vector_theory:
      authority: PMS-VECTOR.md
      governs:
        - VECTOR-specific theoretical claims
        - VECTOR-specific boundaries and reductions
        - paper-linked test and rival burden
      pms_base_openness_is_warrant_for_vector: false
    vector_machine_representation:
      authority: model/PMS-VECTOR.yaml
      role: machine-readable mirror and repository reference
      subordinate_to:
        - PMS.yaml for PMS Base semantics
        - PMS-VECTOR.md for VECTOR-specific theory
    downstream_artifacts:
      model_specification: interpretation and field contract; no additional theory authority
      reference_yaml: provenance/dependency mirrors; no independent warrant
      cases: paper-linked test records; case count is not evidence weight
      examples: non-validating downstream illustrations
      reader: presentation, navigation, and repository-consistency inspection only
  vector_may:
    - "reference PMS operators without redefining them"
    - "reconstruct cross-paper relations"
    - "introduce VECTOR-specific claim types and notation"
    - "define bounded audit and record structures"
    - "yield to rival methods"
    - "reduce its own scope or components"
    - "declare non-capture"

  vector_must_not:
    - "silently_redefine_pms_meta_axioms"
    - "silently_alter_pms_dependency_path"
    - "promote_vector_constructs_to_pms_meta_axioms"
    - "treat_pms_derived_structures_as_independent_primitives"
    - "convert_orientation_to_authority"
    - "convert_structural_attributability_to_moral_fault"
    - "convert_schema_validity_to_theoretical_validity"
    - "convert_case_count_to_evidence_weight"
    - "convert_reader_graph_relations_to_theory"

  non_equivalences:
    - "PMS lineage != epistemic authority inheritance"
    - "machine-readable consistency != theoretical adequacy"
    - "record completeness != claim truth"
    - "schema-valid record != warranted VECTOR result"
    - "case readability != validation"
    - "reader self-test != VECTOR validity"
    - "formal explicitness != metric validation"

pms_reference:
  source: "PMS.yaml"
  schema_version: "PMS_1.3"
  base_dependency_required: true

  operator_semantics_policy: >
    Operator definitions and canonical dependency relations are not owned by
    VECTOR. The operator handles below support explicit cross-reference only.
    Their semantics must be resolved against PMS.yaml.

  fixed_operator_handles:
    - id: "Δ"
      name: "Difference"
    - id: "∇"
      name: "Impulse"
    - id: "□"
      name: "Frame"
    - id: "Λ"
      name: "Non-Event"
    - id: "Α"
      name: "Attractor"
    - id: "Ω"
      name: "Asymmetry"
    - id: "Θ"
      name: "Temporality"
    - id: "Φ"
      name: "Recontextualization"
    - id: "Χ"
      name: "Distance"
    - id: "Σ"
      name: "Integration"
    - id: "Ψ"
      name: "Self-Binding"

  dependency_hygiene:
    definitions_duplicated_here: false
    base_dependency_paths_rewritten_here: false
    reduced_signatures_override_pms_dependencies: false
    note: >
      Any compact VECTOR formula using PMS operators is shorthand inside a
      bounded VECTOR claim. It does not create an alternative PMS operator
      order or dependency path.

  pms_entry_condition_ref: "PMS.yaml#/pms_entry_condition"
  repository_governance_ref: "PMS.yaml#/repository_governance"

  base_open_questions_used_by_vector:
    - "completeness remains open"
    - "optimal operator ordering remains open"
    - "discriminative adequacy remains open"
    - "comparative superiority remains open"
    - "translation does not establish exhaustive capture"
    - "rival formalizations remain methodologically admissible"

vector_identity:
  central_problem: >
    Under what conditions can structural direction be warranted without
    converting local difference into total order, perspectival dependence into
    relativism, framework coherence into authority, or practical effect into
    truth?

  canonical_core:
    notation: "VECTOR := ⟨DIR, ROT⟩"
    component_count: 2
    components:
      - "DIR"
      - "ROT"

    ascii_alias: VECTOR := <DIR, ROT>
  concrete_state:
    notation: "V_t(O | F,Q,π) = ⟨DIR_t, RP_t⟩"
    state_fields:
      - "DIR_t"
      - "RP_t"
    operation_state_boundary: "ROT != RP"

    ascii_alias: V_t(O | F,Q,pi) = <DIR_t, RP_t>
  supporting_relation:
    id: "DIST"
    status: "vector_derived_supporting_construct"
    in_vector_core: false
    meaning: "effective orientation–enactment separation descriptor"

  current_theory_status:
    dir: "retain_scope_narrowed"
    rot: "retain_scope_narrowed"
    dist: "derived_supporting_only"
    adult_orientation: "supporting_shorthand_only"
    standalone_vector: "provisional_retain_scope_reduced"

construct_status_registry:
  purpose: >
    Prevent category collapse among PMS references, VECTOR core functions,
    stored state, supporting shorthand, result types, boundary types, and
    external warrant inputs.
  registry_scope: >
    Construct-class status tokens are declared under statuses. Reduction and
    current-theory status tokens are declared under statuses.reduction_status;
    machine consumers must not infer membership across these status families.
  unknown_status_policy: "reject_or_mark_unresolved"

  statuses:
    pms_operator_reference:
      owned_by_vector: false
      semantics_source: "PMS.yaml"
      examples: ["Δ", "∇", "□", "Λ", "Α", "Ω", "Θ", "Φ", "Χ", "Σ", "Ψ"]

    pms_derived_reference:
      owned_by_vector: false
      semantics_source: "PMS.yaml"
      examples: ["A", "C", "R", "E", "D"]
      examples_role: generic_pms_base_examples_not_current_vector_dependencies
      current_vector_dependency_required: false

    vector_core_claim_family:
      owned_by_vector: true
      examples: ["DIR"]

    vector_core_operation_family:
      owned_by_vector: true
      examples: ["ROT"]

    vector_stored_audit_state:
      owned_by_vector: true
      examples: ["RP"]

    vector_derived_supporting_construct:
      owned_by_vector: true
      independent_core_status: false
      examples: ["DIST"]

    vector_supporting_shorthand:
      owned_by_vector: true
      independent_theoretical_discrimination: false
      examples: ["AdultOrientation"]

    vector_result_type:
      owned_by_vector: true
      examples:
        - "RobustOrientation"
        - "RevisedRobustOrientation"
        - "BoundedOrientation"
        - "RevisionRequired"
        - "TradeOff"
        - "Incomparable"
        - "Suspend"
        - "NonCapture"

    vector_boundary_type:
      owned_by_vector: true
      examples:
        - "OUGHT_choice"
        - "OUGHT_moral"

    vector_positive_ought_relation:
      owned_by_vector: true
      moral_authority_implied: false
      examples:
        - "OUGHT_account"
        - "OUGHT_constraint"

    external_warrant_input:
      owned_by_vector: false
      examples:
        - "historical evidence"
        - "domain measurement"
        - "current law"
        - "medical knowledge"
        - "empirical causal support"
        - "role-specific authority evidence"

    external_calibration_input:
      owned_by_vector: false
      examples:
        - "threshold basis"
        - "domain criterion weights"
        - "specialist measurement scale"

    provenance_status:
      owned_by_vector: true
      ordering_implied: false
      values:
        C: "corpus-carried"
        R: "VECTOR reconstruction"
        N: "VECTOR-new"
        P: "proposed / provisional formalization"

    reduction_status:
      owned_by_vector: true
      values:
