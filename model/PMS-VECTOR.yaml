#
#  IMPORTANT:
#    This file is intentionally not a standalone replacement for PMS.yaml.
#    VECTOR has its own theory architecture, claim types, test burdens, and
#    reductions, but PMS operator semantics, PMS entry conditions, and Base
#    repository governance remain external governing inputs and must be
