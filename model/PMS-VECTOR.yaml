option_space:
  symbol: "𝒪_{a,t}(O | F,Q)"
  status: "supporting_praxeological_architecture"
  core_component: false

  option_statuses:
    - id: "conceivable"
      meaning: "weakest"
    - id: "visible"
      meaning: "epistemically available to the relevant view"
    - id: "structurally_available"
      meaning: "exists in the relevant field"
    - id: "effectively_actionable"
      meaning: "actor / role has effective practical reach"
    - id: "structurally_viable"
      meaning: "can satisfy the declared viability relation"
  non_equivalence_chain:
    - "conceivable != visible"
    - "visible != structurally_available"
    - "structurally_available != effectively_actionable"
    - "effectively_actionable != structurally_viable"

  option_legibility:
    option_invisibility:
      type: "legibility_condition"
      meaning: >
        A relevantly real or realistically transformable option is absent from
        the current legibility field.
      not_by_itself:
        - "option-field error"
        - "Option Blindness"

  option_field_misrepresentation:
    status: "supporting_error_taxonomy"
    umbrella_relation: "UnsupportedExclusion OR UnsupportedInclusion"
    option_blindness:
      type: "unsupported_exclusion"
      meaning: >
        The represented field excludes more current or realistically
        transformable possibility than the declared frame, role, time, capacity,
        dependency, and evidence conditions warrant.
      boundaries:
        - "Option Invisibility != Option Blindness"
        - "Unknown != Unavailable"
        - "Blocked != Nonexistent"
        - "not actionable now != not transformably reachable"
        - "bounded negative after adequate transformability pressure != Option Blindness by default"
        - "Option Blindness != responsibility"
    option_illusion:
      type: "unsupported_inclusion"
      meaning: >
        The represented field includes an alternative as an effective option
        although the conditions required for its relevant availability,
        actionability, viability, or transformability are not sufficiently supported.
      boundaries:
        - "Visible != EffectiveOption"
        - "Conceivable != effective capacity"
        - "special-case probe != effective option"
        - "later capacity != earlier actionability"
        - "Option Illusion != responsibility"

  option_illusion_families:
    - "frame illusion"
    - "capacity illusion"
    - "temporal illusion"
    - "role-transfer illusion"
    - "relational illusion"
    - "cost-blind illusion"

  branch_statuses:
    - "realized"
    - "rejected"
    - "blocked"
    - "deferred"
    - "lost"

  special_case_probe_boundary: "valid probe != valid option"

  canonical_symbol: 𝒪_{a,t}(O | F,Q)
  ascii_alias: O_option(a,t | O,F,Q)
  no_automatic_implication_ladder: true
  option_status_and_evidence_status_are_distinct: true
  evidence_status_boundary:
    unknown_permitted: true
    non_equivalences:
      - Unknown != Unavailable
      - Unknown != Available
  actionable_evidence_may_include:
    - authority
    - access
    - means
    - information
    - time / window
    - dependencies
    - practical control
    - relevant cost
    - procedural permission
  option_field_state_notation:
    canonical: 𝒪_t = (N_t, R_{O,t})
    meaning: option nodes and relations at time t
  action_corridors:
    status: supporting_praxeological_architecture
    meaning: >-
      bounded future reachability opened, preserved, narrowed, or closed by current conditions and praxis
    complete_decision_tree_implied: false
  temporal_option_field:
    field_may_change_over_time: true
    theta_implies_monotonic_shrinkage: false
    non_selection_implies_preservation: false
