        - "retain_with_firewall_narrowed"
        - "derived_supporting_only"
        - "supporting_only"
        - "supporting_shorthand_only"
        - "provisional_retain_scope_reduced"
        - "scope_reduced"
        - "component_reduced"
        - "domain_non_capture"
        - "architecture_reduced"
        - "standalone_reduced"

validity_and_application_boundary:
  pms_entry_condition_required: true
  pms_entry_condition_ref: "PMS.yaml#/pms_entry_condition"

  vector_claim_requirements:
    - typed
    - bounded
    - revisable
    - reference declared
    - frame declared
    - question and claim ceiling declared
    - perspective declared
    - temporal position declared
    - warrant source visible
    - calibration basis visible where material
    - external dependencies preserved
    - non-capture remains possible
  authority_boundary:
    rule: "orientation_up_does_not_imply_authority_up"
    canonical_non_equivalence: "Orientation↑ != Authority↑"
    external_authority_sources_may_include:
      - "law"
      - "consent"
      - "role"
      - "institution"
      - "expertise"
      - "mandate"
      - "moral premises"
    vector_supplies_external_authority: false

  human_boundary:
    person_rank: "prohibited"
    dignity_rank: "prohibited"
    moral_fault_from_vector_alone: "prohibited"
    structural_attributability_is_not:
      - "guilt"
      - "blame"
      - "liability"
      - "moral fault"

  application_non_equivalences:
    - "legibility != direction"
    - "direction != authority"
    - "orientation effect != orientation truth"
    - "structural robustness != practical attribution"
    - "being told != uptake"
    - "visibility != effective capacity"
    - "system carriage required != Person X must carry"

geometry_firewall:
  default_mathematical_status: "relational_and_ordinal_before_metric"

  required_non_equivalences:
    - "VECTOR != vector space by default"
    - "DIR != signed scalar"
    - "ROT != geometric rotation"
    - "DIST != metric distance"
    - "DIR_R != vector sum"
    - O ≠ person worth
    - F ≠ □
    - "DIR != ∇"
    - "ROT != Φ"
    - "ROT != PROJECT_AS"
    - "DIST != Χ"
    - "π != P_MIP"
    - "t != Θ"

    - DIST ≠ REV_avail
    - C_ROT ≠ C_REV
    - reversibility ≠ restoration
  no_default_implication_of:
    - "norm"
    - "magnitude"
    - "angle"
    - "dot product"
    - "vector addition"
    - "Euclidean projection"
    - "invertibility of ROT"
    - "group composition of ROT"
    - "unit for DIST"
    - "total ordering"
    - "transitivity across unrelated questions"

  metric_extension_policy: >
    A domain may separately earn a metric for a bounded variable. Any such
    metric must declare what is measured, calibration, uncertainty, meaning-
    preserving transformations, and non-generalization boundaries. Metric
    extension does not alter the non-metric default of VECTOR as a whole.

reference_coordinates:
  canonical_signature:
    object: O
    frame: F
    question: Q
    perspective: π
    temporal_index: t
  reference_object:
    required: true
    may_include:
      - "praxis scene"
      - "reconstruction"
      - "trajectory"
      - "coordination relation"
      - "option field"
      - "claim"
      - "institutional arrangement"

    not_equivalent_to: person worth
  frame:
    required: true
    fields:
      - "included"
      - "excluded"

    not_equivalent_to: □ (PMS Frame operator)
  question:
    required: true
    fields:
      - "scope"
      - "claim_ceiling"

  perspective:
    required: true
    canonical_symbol: π
    ascii_alias: pi
    not_equivalent_to: P_MIP (MIP practical power)
  temporal_position:
    required: true
    canonical_symbol: t
    scene_analysis_split_required_where_material: true
    scene_time_symbol: t_s
    analysis_time_symbol: t_a
    required_temporal_firewalls:
      - antecedent: "Legibility_analyst(t_a)"
        relation: "does_not_imply"
        consequent: "Legibility_actor(t_s)"
      - antecedent: "knowledge_t_a"
        relation: "does_not_imply"
        consequent: "effective_capacity_t_s"
      - left: "t"
        relation: "not_equivalent_to"
        right: "Θ"
calibration_boundary:
  status: vector_boundary_type
  vector_exposes_threshold_dependencies: true
  vector_generates_all_thresholds_endogenously: false
  thresholds_may_depend_on:
    - source material
    - domain convention
    - empirical measurement
    - legal or technical standards
    - role-specific conditions
    - explicit comparison criteria
    - other externally accountable basis
  threshold_bearing_claims_include:
    - DIR warrant or scope
    - ROT relevance / material distinctness
    - option status
    - effective capacity
    - derived DIST comparisons where shorthand is used
    - convergence
    - test-burden closure
    - structural-attribution uplift
    - constraint-relative necessity
  conform_analyses_may_be_calibration_divergent: true
  calibration_divergence_alone_is_theory_failure: false
  permitted_responses_to_traceable_divergence:
    - narrower scope
    - explicit calibration divergence
    - bounded orientation
    - Suspend
    - rival-sensitive disagreement
    - Non-Capture
  failure_boundary: >-
    Calibration failure begins where material threshold divergence becomes untraceable, concealed, or
    is treated as if VECTOR had generated substantive calibration from its own vocabulary.
  external_to_vector_core: true
vector_architecture:
  core:
    exact_components:
      - id: "DIR"
        type: "directional_claim_family"
      - id: "ROT"
        type: "perspective_testing_and_discovery_operation_family"
    closed_core_for_current_version: true

  state:
    id: "V_t"
    signature: "V_t(O | F,Q,π) = ⟨DIR_t, RP_t⟩"
    fields:
      DIR_t:
        type: "current_directional_claim_or_status"
      RP_t:
        type: "current_rotation_test_profile"
        expands_to: "ROTProfile_t"

    ascii_alias: V_t(O | F,Q,pi) = <DIR_t, RP_t>
  excluded_from_core:
    - "RP"
    - "DIST"
    - "warrant"
    - "calibration"
    - "option_space"
    - "cost_topology"
    - "effective_capacity"
    - "uptake"
    - "result_status"
    - "provenance"
    - "residue"

  expansion_drift_rule: >
    Claim-support fields, derived relations, and practical dependency fields do
    not become VECTOR components merely because they condition, summarize, or
    constrain a VECTOR claim.

dir:
  full_name: "Direction"
  status: "vector_core_claim_family"
  purpose: >
    State a bounded structural direction under a declared reference, frame,
    question, perspective, temporal position, comparison basis, warrant, and
    claim ceiling.

  canonical_relations:
    directed: X ≺_{V,C} Y
    directed_ascii_alias: X <_V,C Y
    trade_off: TradeOff_V(X,Y | C)
    incomparable: X ∥_{V,C} Y
    incomparable_ascii_alias: X ||_V,C Y
    non_capture: ∅_{V,C}
    non_capture_ascii_alias: emptyset_V,C
  validity_conditions:
    - "reference continuity"
    - "declared comparison basis"
    - "warrant visibility"
    - "question-bounded relevance"
    - "non-compensation where dimensions are not legitimately commensurable"
    - "calibration visibility where thresholds or priorities matter"
    - "scope-bounded claim ceiling"
    - "rival vulnerability"

  warrant_source_boundary:
    vector_generates_external_warrant: false
    strong_claim_requires_traceability_to_source: true
    unresolved_external_premises_must_remain_visible: true
    sources_may_include:
      - "PMS corpus structure"
      - "empirical evidence"
      - "domain expertise"
      - "law or policy source"
      - "historical source"
      - "explicit normative premise"
      - "externally calibrated decision model"

  non_compensation:
    default: true
    rule: >
      Distinct claim-critical losses may not be hidden by unexplained aggregate
      gain. Trade-offs remain visible unless commensurability and calibration
      are independently warranted.

  local_not_universal:
    local_superiority_possible: true
    universal_superiority_implied: false
    total_order_implied: false

  failure_condition: >
    DIR must reduce or lose standalone discrimination if relevant cases are
    losslessly captured by pre-existing structures or a same-burden rival
    provides the required directional discrimination more directly.

rot:
  full_name: "Rotation"
  status: "vector_core_operation_family"
  purpose: >
    Apply admissible perspectival change that can test, damage, revise, split,
    collapse, or extend a bounded directional claim while preserving declared
    reference and question conditions where required.

  operation_signature: "ROT_ρ(C_0) → C_1"
  stored_state: "RP"
  required_non_equivalence: "ROT != RP"

  robustness_bearing_rotation:
    requires:
      - "declared change"
      - declared purpose / vulnerability
      - "declared held constants"
      - "reference continuity"
      - "question relevance"
      - "material distinctness"
      - "credible claim-loss route"
    claim_can_be_hurt: true

    same_claim_test_requires_reference_and_question_continuity: true
    exploratory_probe_may_change_frame_without_counting_as_same_claim_survival: true
  exploratory_probe:
    may_generate:
      - "new distinction"
      - "new option"
      - "new consequence"
      - "new question"
      - "new rival"
    robustness_credit_without_loss_route: false

  rotation_families:
    - id: "role"
      name: "Role Rotation"
    - id: "actor_affected_role"
      name: "Actor / Affected-Role Rotation"
    - id: "inside_outside"
      name: "Inside / Outside Rotation"
    - id: "intention_effect"
      name: "Intention / Effect Rotation"
    - id: "temporal"
      name: "Temporal Rotation"
    - id: "omega_position"
      name: "Ω-Position Rotation"
    - id: "counterfactual"
      name: "Counterfactual Rotation"
    - id: "rival_model"
      name: "Rival-Model Rotation"
    - id: "granularity"
      name: "Granularity Rotation"

  outcomes:
    - "invariant"
    - "variant"
    - "emergent"
    - "collapse"

  admissibility_stop:
    may_stop_when:
      - "known claim-critical vulnerabilities have received material pressure"
      - "remaining rotations are redundant"
      - "remaining rotations are irrelevant to the declared claim"
      - "further pressure requires unavailable external evidence"
      - "further pressure belongs to a stronger new claim"
      - current result is already Suspend, Non-Capture, or Revision Required
    stop_is_finality: false

