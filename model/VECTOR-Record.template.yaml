# =============================================================================
# PMS-VECTOR — VECTOR RECORD TEMPLATE
# =============================================================================
#
# Role:
#   Bounded audit/reference scaffold for one VECTOR claim or analysis state.
#
# Theoretical owner:
#   PMS-VECTOR.md — Appendix B (Minimal VECTOR Record)
#
# Machine-readable model owner:
#   model/PMS-VECTOR.yaml
#
# PMS semantic dependency:
#   PMS.yaml
#
# Boundary:
#   This file is a reference template, not a validation schema.
#   Completing it does not validate a VECTOR claim.
#
#   Record completeness != claim correctness.
#   Record richness != warrant strength.
#   Schema-shaped consistency != theoretical adequacy.
#
#   The record does not generate DIR, warrant, calibration, option availability,
#   responsibility, authority, moral conclusions, or universal scores.
#
# No default numeric fields are licensed for:
#   - DIR score;
#   - rotation-count score;
#   - DIST percentage;
#   - responsibility score;
#   - adultness or maturity score;
#   - authority score;
#   - universal confidence percentage.
#
# Requiredness policy:
#   Requiredness follows claim strength and claim type.
#   Conditional blocks remain visible in this template so that the full record
#   grammar can be inspected, but an unpopulated conditional block does not by
#   itself make a claim false or a record invalid.
#
# Canonical claim-bearing coordinates:
#   O  = reference object
#   F  = frame
#   Q  = bounded question / scope
#   π  = declared perspective / position
#   t  = temporal position
#
# Key firewalls:
#   O != person worth
#   F != PMS □
#   π != P_MIP
#   t != PMS Θ
#   ROT != RP
#   DIST is derived supporting only, not VECTOR core
#
# =============================================================================

vector_record:
  # ---------------------------------------------------------------------------
  # CLAIM-BEARING MINIMUM — REFERENCE (O)
  # What is being evaluated? Type the object explicitly enough that later
  # rotation, revision, or comparison cannot silently replace the reference.
  # O != person worth.
  # ---------------------------------------------------------------------------
  reference:
    object:
    object_type:

  # ---------------------------------------------------------------------------
  # CLAIM-BEARING MINIMUM — FRAME (F)
  # Declare what is included and excluded from the bounded evaluation.
  # F != PMS □ (Base boundary operator).
  # ---------------------------------------------------------------------------
  frame:
    included:
    excluded:

  # ---------------------------------------------------------------------------
  # CLAIM-BEARING MINIMUM — QUESTION (Q)
  # Keep the directional/orientational question bounded and declare the
  # strongest conclusion that the record does NOT license.
  # ---------------------------------------------------------------------------
  question:
    scope:
    claim_ceiling:

  # ---------------------------------------------------------------------------
  # CLAIM-BEARING MINIMUM — POSITION (π, t)
  # Perspective and temporal position are material claim coordinates.
  # π != P_MIP; t != PMS Θ.
  #
  # scene_time / analysis_time are CONDITIONAL. Populate where retrospective
  # actor-facing, uptake, option, or praxis claims make the distinction material.
  #
  # Legibility_analyst(t_a) does not imply Legibility_actor(t_s).
  # knowledge_at_t_a does not imply effective_capacity_at_t_s.
  # ---------------------------------------------------------------------------
  position:
    perspective:
    temporal_position:
    scene_time:
    analysis_time:

  # ---------------------------------------------------------------------------
  # CLAIM-BEARING MINIMUM — BASELINE CLAIM (S_0)
  # Preserve the proposition actually being tested. Later revision must not
  # overwrite the original baseline. Revision != Survival.
  # ---------------------------------------------------------------------------
  baseline_claim:

  # ---------------------------------------------------------------------------
  # DIR (Direction)
  # RESULT / CLAIM-DEPENDENT.
  #
  # DIR is local, reference-bounded, frame-bounded, question-bounded,
  # non-compensatory, and warrant-dependent. It is not a universal scalar.
  #
  # relation may record a bounded direction, trade-off, incomparability, or
  # absence of warranted DIR. Do not insert a numeric DIR score by default.
  #
  # Warrant fields expose support and unresolved dependencies; they do not
  # manufacture support. Notation reuse != warrant generation.
  # ---------------------------------------------------------------------------
  dir:
    relation:
    comparison_basis:
    warrant:
      source_types:
      external_premises:
      unresolved_dependencies:
    critical_regressions:

  # ---------------------------------------------------------------------------
  # CALIBRATION
  # CONDITIONAL — populate only where a material distinction depends on a
  # threshold, calibration source, or defensible competing calibration.
  #
  # Calibration may be externally supplied. VECTOR notation does not convert
  # imported calibration into VECTOR-generated warrant.
  #
  # CalibrationFailure -> ClaimReduction or Suspend.
  # ---------------------------------------------------------------------------
  calibration:
    threshold:
    basis:
    domain_source:
    competing_calibration:
    unresolved:

  # ---------------------------------------------------------------------------
  # ROT PROFILE (RP)
  # REQUIRED for robustness-bearing claims; otherwise claim-type dependent.
  #
  # ROT = operation/test family.
  # RP  = stored audit state containing applied and open ROT pressure.
  # ROT != RP.
  #
  # A robustness-bearing ROT must expose:
  #   declared change + declared constants + reference continuity +
  #   question relevance + loss capacity, with operational purpose visible.
  #
  # Rotation selection follows claim vulnerability, not desired outcome.
  # Known material pressure must not disappear merely because it is untested.
  # ---------------------------------------------------------------------------
  rot_profile:
    applied:
      - family:
        vulnerability:
        purpose:
        changed:
        held_constant:
        reference_continuity:
        material_distinctness:
        loss_route:
        result:
        robustness_relevance:
    untested_relevant:
    stop_basis:

  # ---------------------------------------------------------------------------
  # DERIVED DIST (Distance)
  # CONDITIONAL / OPTIONAL SUPPORTING SHORTHAND ONLY.
  #
  # DIST is not in VECTOR core and does not add independent warrant.
  # A DIST label without its source relations adds no warrant.
  # DIST != PMS Χ (distance).
  # DIST != REV_avail.
  # ---------------------------------------------------------------------------
  dist_derived:
    effective_separation:
    source_relations:
    role_variation:

  # ---------------------------------------------------------------------------
  # REVERSIBILITY
  # CONDITIONAL — use where correction, exit, redirection, enacted commitment,
  # or restoration claims are material.
  #
  # C_ROT = practical friction attached to reorientation.
  # C_REV = cost attached to changing enacted or bound praxis.
  # C_ROT != C_REV.
  # reversibility != restoration.
  # REV_avail increasing does not imply praxis quality increasing.
  # ---------------------------------------------------------------------------
  reversibility:
    available:
    rotation_cost:
    reversal_cost:
    restoration_possible:

  # ---------------------------------------------------------------------------
  # OPTION SPACE
  # CONDITIONAL — use where possibility, actionability, viability, option
  # legibility, option-field misrepresentation, branch status, or special-case
  # probes are material.
  #
  # Keep OPTION STATUS, BRANCH STATUS, and EVIDENCE STATUS distinct.
  #
  # Option-status predicates:
  #   conceivable; visible; structurally available; effectively actionable;
  #   structurally viable.
  #
  # Branch status where material:
  #   realized; rejected; blocked; deferred; lost.
  #
  # Evidence status remains separate.
  # Unknown != Available.
  # Unknown != Unavailable.
  #
  # No automatic implication ladder is licensed:
  # conceivable -> visible -> structurally available -> effectively actionable
  # -> structurally viable is NOT automatic.
  #
  # Option-field firewalls:
  #   Option Invisibility != Option Blindness.
  #   Option Invisibility is a legibility condition, not by itself an
  #   option-field error.
  #   Unknown != Unavailable.
  #   Blocked != Nonexistent.
  #   Not actionable now != not transformably reachable.
  #   A bounded negative after adequate pressure != Option Blindness by default.
  #   Visible != EffectiveOption.
  #   Conceivable != effective capacity.
  #   Special-case probe != effective option.
  #   Later capacity != earlier actionability.
  #
  # Option-field misrepresentation does not by itself establish responsibility,
  # blame, obligation, or authority.
  #
  # For actionability, populate material authority/access/means/information/
  # window/dependency/control/cost/permission fields rather than inferring
  # actionability from mere conceivability.
  # ---------------------------------------------------------------------------
  option_space:
    actor_or_role:
    options:
      - option:
        status:
        branch_status:
        evidence_status:
        authority:
        access:
        means:
        information:
        window:
        dependencies:
        practical_control:
        relevant_cost:
        procedural_permission:
        viability_relative_to:
    option_invisibility:
    option_field_misrepresentation:
      blindness:
        unsupported_exclusions:
      illusion:
        unsupported_inclusions:
    special_case_probes:

  # ---------------------------------------------------------------------------
  # TRANSFORMABILITY / SECOND-ORDER AGENCY
  # CONDITIONAL — use for claims that actors or actor configurations can alter
  # option nodes, option relations, constraints, or the conditions of action.
  #
  # Conceivable transformation != available transformation.
  # A material second-order claim should expose mechanism, effective capacity,
  # dependencies, temporal window, evidence, and resulting node/relation change.
  # Formal target where useful: ΔN and/or ΔR_O.
  # Without sufficient mechanism/capacity support, retain the item as a probe.
  # ---------------------------------------------------------------------------
  transformability:
    actor_configuration:
    target_change:
    mechanism:
    authority_capacity:
    dependencies:
    window:
    evidence:
    node_changes:
    relation_changes:

  # ---------------------------------------------------------------------------
  # CONSEQUENCE TOPOLOGY
  # CONDITIONAL — record claim-critical consequences and costs without forcing
  # heterogeneous items into a universal aggregate.
  #
  # Recommended evidence statuses include:
  #   observed/directly established;
  #   externally supported;
  #   traceably inferred;
  #   hypothetical;
  #   unknown/residual.
  #
  # unknown_residue (Λ) is remainder/non-event, not a positive hidden-cost claim.
  # ---------------------------------------------------------------------------
  consequence_topology:
    items:
      - type:
        bearer:
        temporal_relation:
        mechanism_source:
        evidence_status:
    unknown_residue:

  # ---------------------------------------------------------------------------
  # CONSTRAINT RECORD
  # CONDITIONAL — populate only for constraint-level claims.
  #
  # claimed_authority records authority that is asserted or under examination;
  # the field does not validate that authority.
  #
  # Source(G) != Legitimacy(G).
  # SystemCarriageRequired != PersonXMustCarry.
  # FixpointRequirement != BearerAuthority.
  # A Tragic Constraint claim remains evidentially bounded and is defeated by an
  # evidenced effective non-lossful route/transformation; it is not a claim of
  # metaphysical impossibility.
  # ---------------------------------------------------------------------------
  constraint:
    G:
    maintained_by:
    modifiable_by:
    claimed_authority:
    burden_bearers:
    exit_relations:
    alternative_carriers:
    transformation_routes:
    abandon_or_revision_consequences:
    unknowns:
    external_legitimacy_question:

  # ---------------------------------------------------------------------------
  # ORIENTATION UPTAKE
  # CONDITIONAL — use only where orientation-mediated attribution increase is
  # claimed.
  #
  # presented != actor_accessible != understood != praxis_available != enacted.
  # Being told is not uptake.
  #
  # BaselineAttributability_LOGIC != ΔAttributability_orientation.
  # Missing uptake must not erase baseline structural attributability already
  # supported independently under PMS-LOGIC.
  # ---------------------------------------------------------------------------
  orientation_uptake:
    presented:
    actor_accessible:
    understood:
    praxis_available:
    actor_response:

  # ---------------------------------------------------------------------------
  # PRESSURE
  # CLAIM-STRENGTH DEPENDENT.
  #
  # Use this block for serious rival pressure, counter-scenes/counter-positions,
  # provenance dependence, non-compensation, and known critical open tests.
  # ROT pressure itself remains recorded in rot_profile.
  #
  # A serious rival must be capable of materially changing or defeating the
  # relevant claim in its own vocabulary. Critical open tests do not disappear
  # merely because a current iteration has a stop basis.
  # ---------------------------------------------------------------------------
  pressure:
    rivals:
    counter_scenes:
    provenance_dependencies:
    non_compensation:
    critical_open_tests:

  # ---------------------------------------------------------------------------
  # RESULT
  # REQUIRED for a completed record state.
  #
  # Use a typed paper-compatible result where applicable, including:
  #   Robust Orientation;
  #   Revised Robust Orientation;
  #   Bounded Orientation;
  #   Revision Required;
  #   Trade-Off / Multidirectional;
  #   Incomparable;
  #   Suspend;
  #   Non-Capture.
  #
  # surviving_claim records what remains after pressure.
  # revisions must preserve the fact that Revision != Survival.
  # scope carries explicit narrowing or other boundedness.
  # residue carries Λ_remaining and unresolved dependence.
  # stop_reason explains responsible closure, suspension, or refusal; it does not
  # mean "tests passed, therefore true".
  #
  # Non-Capture may terminate before a full downstream option/cost/constraint map
  # is populated. Absence of irrelevant conditional fields is not a defect.
  # ---------------------------------------------------------------------------
  result:
    status:
    surviving_claim:
    revisions:
    scope:
    residue:
    stop_reason:
